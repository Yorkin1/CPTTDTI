name: Agregar cliente

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Nombre corto del cliente (ej: barberia)"
        required: true
      spreadsheet_url:
        description: "URL completa de la hoja de cálculo compartida"
        required: true

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install googleapis

      - name: Restaurar credenciales de clasp
        run: |
          echo "$CLASP_CREDENTIALS" > ~/.clasprc.json
          node --input-type=commonjs -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.env.HOME+"/.clasprc.json","utf8"));console.log("Clasprc keys:",JSON.stringify(Object.keys(c)));if(c.tokens){console.log("Tokens keys:",JSON.stringify(Object.keys(c.tokens)));console.log("Tokens type:",typeof c.tokens);if(typeof c.tokens==="object"&&!Array.isArray(c.tokens)){console.log("Tokens object keys:",JSON.stringify(Object.keys(c.tokens)))}else if(Array.isArray(c.tokens)){console.log("Tokens is array, first item keys:",c.tokens.length>0?JSON.stringify(Object.keys(c.tokens[0])):"empty")}}else if(c.token){console.log("Token keys:",JSON.stringify(Object.keys(c.token)))}else{console.log("No token/tokens field")}'
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Detectar scriptId y deploymentId
        id: detectar
        run: |
          node --input-type=commonjs -e '
            (async () => {
              const fs = require("fs");
              const { google } = require("googleapis");

              const slug = "${{ github.event.inputs.slug }}";
              const url = "${{ github.event.inputs.spreadsheet_url }}";

              const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
              if (!match) {
                console.error("URL invalida: no se pudo extraer el ID del spreadsheet");
                process.exit(1);
              }
              const spreadsheetId = match[1];
              console.log("Spreadsheet ID: " + spreadsheetId);

              const clasprcPath = process.env.HOME + "/.clasprc.json";
              console.log("Leyendo credenciales de: " + clasprcPath);
              const clasprc = JSON.parse(fs.readFileSync(clasprcPath, "utf8"));
              console.log("Estructura clasprc:", JSON.stringify(Object.keys(clasprc)));

              // Buscar token en diferentes estructuras posibles
              const tokenObj = clasprc.token || clasprc.tokens || clasprc;
              const clientId = tokenObj.client_id || clasprc.client_id || "";
              const clientSecret = tokenObj.client_secret || clasprc.client_secret || "";
              const accessToken = tokenObj.access_token;
              const refreshToken = tokenObj.refresh_token;

              if (!accessToken || !refreshToken || !clientId || !clientSecret) {
                console.error("Faltan campos en las credenciales. Estructura encontrada:", JSON.stringify(clasprc, null, 2));
                process.exit(1);
              }

              const oauth2 = new google.auth.OAuth2(clientId, clientSecret, "https://developers.google.com/oauthplayground");
              oauth2.setCredentials({
                access_token: accessToken,
                refresh_token: refreshToken
              });

              const script = google.script({ version: "v1", auth: oauth2 });
              const res = await script.projects.list();
              const projects = res.data.projects || [];

              const project = projects.find(p => p.parentId === spreadsheetId);
              if (!project) {
                console.error("No se encontro un Apps Script vinculado a este spreadsheet");
                console.error("Asegurate de que la hoja esta compartida con gestorcitasactualizador@gmail.com como Editor");
                process.exit(1);
              }

              const scriptId = project.scriptId;
              console.log("Script ID: " + scriptId);

              const deployRes = await script.projects.deployments.list({ scriptId });
              const deployments = deployRes.data.deployments || [];

              const headDeployment = deployments.find(d => d.deploymentConfig && d.deploymentConfig.versionNumber === "0");
              let deploymentId;

              if (headDeployment) {
                deploymentId = headDeployment.deploymentId;
              } else if (deployments.length > 0) {
                deploymentId = deployments[0].deploymentId;
              } else {
                console.error("No hay implementaciones para este script. Crea una implementacion en el editor de Apps Script primero.");
                process.exit(1);
              }

              console.log("Deployment ID: " + deploymentId);

              const result = {
                slug: slug,
                scriptId: scriptId,
                deploymentId: deploymentId,
                spreadsheetId: spreadsheetId
              };
              fs.writeFileSync("/tmp/cliente-detectado.json", JSON.stringify(result, null, 2));
              console.log("Cliente detectado correctamente");
            })();
          '

      - name: Agregar a clientes.json
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const cliente = JSON.parse(fs.readFileSync("/tmp/cliente-detectado.json", "utf8"));
            const clientesPath = "./deploy/clientes.json";

            let clientes = [];
            if (fs.existsSync(clientesPath)) {
              clientes = JSON.parse(fs.readFileSync(clientesPath, "utf8"));
            }

            // Verificar que no exista ya
            if (clientes.some(c => c.slug === cliente.slug)) {
              console.error("Ya existe un cliente con el slug: " + cliente.slug);
              process.exit(1);
            }

            // Agregar nuevo cliente
            clientes.push({
              slug: cliente.slug,
              scriptId: cliente.scriptId,
              deploymentId: cliente.deploymentId,
              spreadsheetId: cliente.spreadsheetId,
              activo: true
            });

            fs.writeFileSync(clientesPath, JSON.stringify(clientes, null, 2));
            console.log("Cliente agregado: " + cliente.slug);
          '

      - name: Commit cambios
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/clientes.json
          git commit -m "feat: agregar cliente ${{ github.event.inputs.slug }}"
          git push
