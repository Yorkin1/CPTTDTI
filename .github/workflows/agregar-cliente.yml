name: Agregar cliente

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Nombre corto del cliente (ej: barberia)"
        required: true
      script_id:
        description: "Script ID del Apps Script (de la URL del editor)"
        required: true

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp
      - run: npm install googleapis

      - name: Restaurar credenciales
        run: node deploy/restaurar-credenciales.js
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Obtener datos del cliente
        id: detectar
        run: node deploy/detectar-cliente.js
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          INPUT_SCRIPT_ID: ${{ github.event.inputs.script_id }}

      - name: Agregar a clientes.json
        run: node deploy/agregar-cliente-json.js

      - name: Commit cambios
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/clientes.json
          git commit -m "feat: agregar cliente ${{ github.event.inputs.slug }}"
          git push
