name: Actualizar copias de clientes

on:
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp

      - name: Restaurar credenciales de clasp
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const raw = JSON.parse(process.env.CLASP_CREDENTIALS);
            let output;
            if (raw.tokens && raw.tokens.default) {
              output = raw;
              console.log("Formato V3 detectado (tokens.default)");
            } else if (raw.token && raw.oauth2ClientSettings) {
              output = raw;
              console.log("Formato V1 local detectado");
            } else if (raw.token) {
              output = {
                token: raw.token,
                oauth2ClientSettings: {
                  clientId: raw.token.client_id,
                  clientSecret: raw.token.client_secret
                }
              };
              console.log("Formato V1 sin oauth2ClientSettings, completado");
            } else if (raw.access_token) {
              output = {
                tokens: {
                  default: {
                    access_token: raw.access_token,
                    refresh_token: raw.refresh_token,
                    token_type: raw.token_type || "Bearer",
                    client_id: raw.client_id || "1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com",
                    client_secret: raw.client_secret || "v6V3fKV_zWU7iw1DrpO1rknX"
                  }
                }
              };
              console.log("Formato V1 global, convertido a V3");
            } else {
              output = raw;
              console.log("Formato desconocido, usando tal cual");
            }
            fs.writeFileSync(process.env.HOME + "/.clasprc.json", JSON.stringify(output, null, 2));
            console.log("Credenciales escritas en: " + process.env.HOME + "/.clasprc.json");
          '
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Generar appsscript.json
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const manifest = {
              timeZone: "America/Santo_Domingo",
              dependencies: {},
              exceptionLogging: "STACKDRIVER",
              runtimeVersion: "V8",
              oauthScopes: [
                "https://www.googleapis.com/auth/spreadsheets",
                "https://www.googleapis.com/auth/calendar",
                "https://www.googleapis.com/auth/drive",
                "https://www.googleapis.com/auth/documents",
                "https://www.googleapis.com/auth/script.send_mail",
                "https://www.googleapis.com/auth/script.container.ui",
                "https://www.googleapis.com/auth/userinfo.email"
              ],
              webapp: {
                executeAs: "USER_DEPLOYING",
                access: "ANYONE"
              },
              executionApi: {
                access: "MYSELF"
              }
            };
            fs.writeFileSync("./src/appsscript.json", JSON.stringify(manifest, null, 2));
          '

      - name: Empujar a cada cliente activo + health check
        run: |
          node --input-type=commonjs -e '
            const clientes = require("./deploy/clientes.json");
            const { execSync } = require("child_process");
            const fs = require("fs");
            const https = require("https");
            const { google } = require("googleapis");
            const sha = (process.env.GITHUB_SHA || "").slice(0, 7);
            const ahora = new Date();
            const fechaLegible = ahora.toLocaleString("es-DO", { timeZone: "America/Santo_Domingo" });
            let fallos = [];
            let exitosos = [];
            let saltados = [];
            let clientesModificados = false;
            let infoVersiones = {};

            // OAuth para consultar versiones
            const raw = JSON.parse(process.env.CLASP_CREDENTIALS);
            const tokenObj = raw.tokens?.default || raw.token || raw;
            const oauth2 = new google.auth.OAuth2(
              tokenObj.client_id,
              tokenObj.client_secret,
              "https://developers.google.com/oauthplayground"
            );
            oauth2.setCredentials({
              access_token: tokenObj.access_token,
              refresh_token: tokenObj.refresh_token
            });
            const scriptApi = google.script({ version: "v1", auth: oauth2 });

            // Funcion para health check
            function healthCheck(deploymentId) {
              return new Promise((resolve) => {
                const url = "https://script.google.com/macros/s/" + deploymentId + "/exec";
                const req = https.get(url, { timeout: 15000 }, (res) => {
                  resolve({ ok: res.statusCode === 200 || res.statusCode === 302, statusCode: res.statusCode });
                });
                req.on("error", () => resolve({ ok: false, statusCode: 0 }));
                req.on("timeout", () => { req.destroy(); resolve({ ok: false, statusCode: 0 }); });
              });
            }

            // Funcion para contar versiones
            async function contarVersiones(scriptId) {
              try {
                const res = await scriptApi.projects.versions.list({ scriptId, pageSize: 200 });
                return (res.data.versions || []).length;
              } catch (e) {
                return -1;
              }
            }

            // Procesar cada cliente
            (async () => {
              for (const c of clientes) {
                const registro = {
                  slug: c.slug,
                  activo: c.activo,
                  scriptId: c.scriptId,
                  deploymentId: c.deploymentId,
                  spreadsheetId: c.spreadsheetId,
                  status: "pendiente",
                  healthCheck: "no verificado",
                  url: "https://script.google.com/macros/s/" + c.deploymentId + "/exec",
                  ultimoUpdate: c.ultimoUpdate || null,
                  error: null,
                  versiones: 0
                };

                if (!c.activo) {
                  console.log("⊘ " + c.slug + " (inactivo, saltando)");
                  registro.status = "saltado";
                  saltados.push(c.slug);
                  c._registro = registro;
                  continue;
                }

                console.log("→ " + c.slug);
                fs.writeFileSync(".clasp.json", JSON.stringify({
                  scriptId: c.scriptId,
                  rootDir: "./src",
                  scriptExtensions: [".js", ".gs"],
                  htmlExtensions: [".html"],
                  jsonExtensions: [".json"],
                  filePushOrder: [],
                  skipSubdirectories: false
                }, null, 2));

                // Contar versiones antes
                const versionesAntes = await contarVersiones(c.scriptId);
                registro.versiones = versionesAntes;
                if (versionesAntes > 180) {
                  console.log("  ADVERTENCIA: " + versionesAntes + " versiones (limite proximo)");
                }

                try {
                  execSync("clasp push -f", { stdio: "inherit" });

                  // Paso 1: Intentar actualizar la implementacion existente
                  let deployOk = false;
                  try {
                    execSync("clasp deploy -i " + c.deploymentId + " -d \"auto: " + sha + "\"", { stdio: "inherit" });
                    console.log("  ✓ Implementacion actualizada");
                    deployOk = true;
                  } catch (deployErr) {
                    // Paso 2: Si falla (implementacion archivada), crear nueva
                    console.log("  ⚠ Implementacion archivada, creando nueva...");
                    try {
                      const output = execSync("clasp deploy -d \"auto: " + sha + "\"", { encoding: "utf8", stdio: "pipe" });
                      console.log(output);
                      const match = output.match(/(?:Uploaded|Deployed)\s+([a-zA-Z0-9_-]+)/);
                      if (match && match[1]) {
                        c.deploymentId = match[1];
                        registro.deploymentId = match[1];
                        registro.url = "https://script.google.com/macros/s/" + match[1] + "/exec";
                        clientesModificados = true;
                        console.log("  ✓ Nueva implementacion: " + match[1]);
                        deployOk = true;
                      } else {
                        console.error("  ✗ No se pudo extraer el nuevo deploymentId");
                      }
                    } catch (newDeployErr) {
                      console.error("  ✗ Fallo al crear nueva implementacion");
                    }
                  }

                  // Health check
                  if (deployOk) {
                    const hc = await healthCheck(c.deploymentId);
                    registro.healthCheck = hc.ok ? "ok" : "fallo_http_" + hc.statusCode;
                    console.log("  Health check: " + (hc.ok ? "✓ OK (HTTP " + hc.statusCode + ")" : "✗ Fallo (HTTP " + hc.statusCode + ")"));

                    if (hc.ok) {
                      registro.status = "ok";
                      registro.ultimoUpdate = fechaLegible;
                      c.ultimoUpdate = fechaLegible;
                      exitosos.push(c.slug);
                    } else {
                      registro.status = "warning";
                      registro.error = "Deploy exitoso pero health check fallo HTTP " + hc.statusCode;
                      exitosos.push(c.slug);
                    }
                  } else {
                    registro.status = "error";
                    registro.error = "Fallo al crear/actualizar implementacion";
                    fallos.push(c.slug);
                  }

                  // Contar versiones despues
                  const versionesDespues = await contarVersiones(c.scriptId);
                  registro.versiones = versionesDespues;
                } catch (e) {
                  console.error("  ✗ Fallo general: " + e.message);
                  registro.status = "error";
                  registro.error = e.message;
                  fallos.push(c.slug);
                }

                c._registro = registro;
              }

              // Guardar clientes.json actualizado
              if (clientesModificados) {
                const clientesGuardar = clientes.map(c => {
                  return {
                    slug: c.slug,
                    scriptId: c.scriptId,
                    deploymentId: c.deploymentId,
                    spreadsheetId: c.spreadsheetId,
                    activo: c.activo,
                    ultimoUpdate: c.ultimoUpdate || undefined
                  };
                });
                fs.writeFileSync("./deploy/clientes.json", JSON.stringify(clientesGuardar, null, 2) + "\n");
                console.log("\nclientes.json actualizado.");
              }

              // === GENERAR REPORTE MARKDOWN ===
              let md = "";
              md += "# Reporte de Clientes\n\n";
              md += "**Ultima actualizacion:** " + fechaLegible + "  \n";
              md += "**Commit:** " + sha + "\n\n";
              md += "## Resumen\n\n";
              md += "- **Total:** " + clientes.length + "\n";
              md += "- **Exitosos:** " + exitosos.length + "\n";
              md += "- **Fallidos:** " + fallos.length + "\n";
              md += "- **Saltados:** " + saltados.length + "\n\n";

              // Seccion de versiones
              md += "## Versiones\n\n";
              md += "| Cliente | Versiones | Estado |\n";
              md += "|---------|-----------|--------|\n";
              for (const c of clientes) {
                if (!c.activo) continue;
                const r = c._registro || {};
                const v = r.versiones || 0;
                const estado = v > 180 ? "ADVERTENCIA" : (v > 0 ? "OK" : "—");
                md += "| " + c.slug + " | " + v + " / 200 | " + estado + " |\n";
              }

              md += "\n---\n\n";
              md += "## Estado de clientes\n\n";
              md += "| Cliente | Estado | Health Check | Ultimo Update | Error |\n";
              md += "|---------|--------|--------------|---------------|-------|\n";

              for (const c of clientes) {
                const r = c._registro || {};
                const iconoStatus = r.status === "ok" ? "ok" : (r.status === "warning" ? "warning" : (r.status === "error" ? "error" : "saltado"));
                const iconoHc = r.healthCheck === "ok" ? "ok" : (r.healthCheck === "no verificado" ? "—" : "fallo");
                const error = r.error || "—";
                md += "| " + c.slug + " | " + iconoStatus + " | " + iconoHc + " | " + (r.ultimoUpdate || "—") + " | " + error + " |\n";
              }

              md += "\n---\n\n";
              md += "## Detalle\n\n";

              for (const c of clientes) {
                if (!c.activo) continue;
                md += "### " + c.slug + "\n";
                md += "- **Script ID:** " + c.scriptId + "\n";
                md += "- **Deployment ID:** " + c.deploymentId + "\n";
                md += "- **Spreadsheet ID:** " + c.spreadsheetId + "\n";
                md += "- **URL:** " + "https://script.google.com/macros/s/" + c.deploymentId + "/exec\n";
                md += "- **Estado:** " + (c._registro ? c._registro.status : "sin_datos") + "\n";
                md += "- **Versiones:** " + (c._registro ? c._registro.versiones : "?") + " / 200\n";
                if (c._registro && c._registro.error) {
                  md += "- **Error:** " + c._registro.error + "\n";
                }
                md += "\n";
              }

              fs.writeFileSync("./deploy/REPORT.md", md);

              // Resumen final
              console.log("");
              console.log("=== RESUMEN ===");
              console.log("Exitosos: " + exitosos.length + " | Fallidos: " + fallos.length + " | Saltados: " + saltados.length);
              if (exitosos.length) console.log("  OK: " + exitosos.join(", "));
              if (fallos.length) console.log("  FAIL: " + fallos.join(", "));
              if (saltados.length) console.log("  SKIP: " + saltados.join(", "));
              console.log("Reporte: deploy/REPORT.md");

              if (fallos.length) {
                process.exit(1);
              }
            })();
          '
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Commit reportes y cambios
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/clientes.json deploy/REPORT.md
          git diff --cached --quiet || git commit -m "reporte: actualizar clientes + health check + versiones"
          git push
