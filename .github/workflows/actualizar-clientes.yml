name: Actualizar copias de clientes

on:
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp
      - run: npm install googleapis

      - name: Restaurar credenciales de clasp
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const raw = JSON.parse(process.env.CLASP_CREDENTIALS);
            let output;
            if (raw.tokens && raw.tokens.default) {
              output = raw;
              console.log("Formato V3 detectado (tokens.default)");
            } else if (raw.token && raw.oauth2ClientSettings) {
              output = raw;
              console.log("Formato V1 local detectado");
            } else if (raw.token) {
              output = {
                token: raw.token,
                oauth2ClientSettings: {
                  clientId: raw.token.client_id,
                  clientSecret: raw.token.client_secret
                }
              };
              console.log("Formato V1 sin oauth2ClientSettings, completado");
            } else if (raw.access_token) {
              output = {
                tokens: {
                  default: {
                    access_token: raw.access_token,
                    refresh_token: raw.refresh_token,
                    token_type: raw.token_type || "Bearer",
                    client_id: raw.client_id || "1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com",
                    client_secret: raw.client_secret || "v6V3fKV_zWU7iw1DrpO1rknX"
                  }
                }
              };
              console.log("Formato V1 global, convertido a V3");
            } else {
              output = raw;
              console.log("Formato desconocido, usando tal cual");
            }
            fs.writeFileSync(process.env.HOME + "/.clasprc.json", JSON.stringify(output, null, 2));
            console.log("Credenciales escritas en: " + process.env.HOME + "/.clasprc.json");
          '
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Generar appsscript.json
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const manifest = {
              timeZone: "America/Santo_Domingo",
              dependencies: {},
              exceptionLogging: "STACKDRIVER",
              runtimeVersion: "V8",
              oauthScopes: [
                "https://www.googleapis.com/auth/spreadsheets",
                "https://www.googleapis.com/auth/calendar",
                "https://www.googleapis.com/auth/drive",
                "https://www.googleapis.com/auth/documents",
                "https://www.googleapis.com/auth/script.send_mail",
                "https://www.googleapis.com/auth/script.container.ui",
                "https://www.googleapis.com/auth/userinfo.email"
              ],
              webapp: {
                executeAs: "USER_DEPLOYING",
                access: "ANYONE"
              },
              executionApi: {
                access: "MYSELF"
              }
            };
            fs.writeFileSync("./src/appsscript.json", JSON.stringify(manifest, null, 2));
          '

      - name: Empujar a cada cliente activo
        run: |
          node --input-type=commonjs -e '
            const clientes = require("./deploy/clientes.json");
            const { execSync } = require("child_process");
            const fs = require("fs");
            const sha = (process.env.GITHUB_SHA || "").slice(0, 7);
            const commitMsg = execSync("git log -1 --format=%s " + (process.env.GITHUB_SHA || "HEAD"), { encoding: "utf8" }).trim();
            const fecha = new Date().toISOString().slice(0, 10);
            const desc = fecha + ": " + commitMsg;
            let fallos = [];
            let exitosos = [];
            let clientesModificados = false;

            for (const c of clientes) {
              if (!c.activo) {
                console.log("⊘ " + c.slug + " (inactivo, saltando)");
                continue;
              }
              console.log("→ " + c.slug);
              fs.writeFileSync(".clasp.json", JSON.stringify({
                scriptId: c.scriptId,
                rootDir: "./src",
                scriptExtensions: [".js", ".gs"],
                htmlExtensions: [".html"],
                jsonExtensions: [".json"],
                filePushOrder: [],
                skipSubdirectories: false
              }, null, 2));
              try {
                execSync("clasp push -f", { stdio: "inherit" });

                let deployOk = false;

                try {
                  const output = execSync("clasp deploy -i " + c.deploymentId + " -d \"" + desc + "\"", { encoding: "utf8", stdio: "pipe" });
                  console.log(output);
                  console.log("✓ " + c.slug + " actualizado");
                  exitosos.push(c.slug);
                  deployOk = true;
                } catch (updateErr) {
                  console.log("  " + c.slug + ": no se pudo actualizar implementación existente, creando nueva...");
                }

                if (!deployOk) {
                  try {
                    const output = execSync("clasp deploy -d \"" + desc + "\"", { encoding: "utf8", stdio: "pipe" });
                    console.log(output);
                    const match = output.match(/Deployed\s+([a-zA-Z0-9_-]+)\s+@/);
                    if (match && match[1]) {
                      c.deploymentId = match[1];
                      clientesModificados = true;
                      console.log("✓ " + c.slug + " nueva implementación: " + match[1]);
                      exitosos.push(c.slug);
                    } else {
                      console.error("✗ " + c.slug + ": no se pudo extraer el nuevo deploymentId");
                      console.error("Salida:", output);
                      fallos.push(c.slug);
                    }
                  } catch (newDeployErr) {
                    console.error("✗ " + c.slug + ": falló al crear nueva implementación");
                    console.error(newDeployErr.message);
                    fallos.push(c.slug);
                  }
                }
              } catch (e) {
                console.error("✗ Falló " + c.slug + ": " + e.message);
                fallos.push(c.slug);
              }
            }

              if (clientesModificados) {
                fs.writeFileSync("./deploy/clientes.json", JSON.stringify(clientes, null, 2) + "\n");
                console.log("\nArchivos de clientes actualizados.");
              }

              const ahora = new Date();
              const fechaLegible = ahora.toLocaleString("es-DO", { timeZone: "America/Santo_Domingo" });
              let md = "# Reporte de Clientes\n\n";
              md += "**Fecha:** " + fechaLegible + "  \n";
              md += "**Commit:** " + sha + "\n\n";
              md += "## Resumen\n\n";
              md += "- **Total:** " + clientes.length + "\n";
              md += "- **Exitosos:** " + exitosos.length + "\n";
              md += "- **Fallidos:** " + fallos.length + "\n\n";
              md += "## Estado\n\n";
              md += "| Cliente | Estado | URL |\n";
              md += "|---------|--------|-----|\n";
              for (const c of clientes) {
                const ok = exitosos.includes(c.slug);
                const fallo = fallos.includes(c.slug);
                const estado = fallo ? "error" : (ok ? "ok" : "saltado");
                const url = "https://script.google.com/macros/s/" + c.deploymentId + "/exec";
                md += "| " + c.slug + " | " + estado + " | " + url + " |\n";
              }
              md += "\n---\n\n";
              md += "## Detalle\n\n";
              for (const c of clientes) {
                md += "### " + c.slug + "\n";
                md += "- **Script ID:** " + c.scriptId + "\n";
                md += "- **Deployment ID:** " + c.deploymentId + "\n";
                md += "- **Spreadsheet ID:** " + c.spreadsheetId + "\n";
                md += "- **URL:** https://script.google.com/macros/s/" + c.deploymentId + "/exec\n\n";
              }
              fs.writeFileSync("./deploy/REPORT.md", md);
              console.log("\nReporte: deploy/REPORT.md");

              console.log("");
              console.log("Resumen: " + exitosos.length + " exitosos, " + fallos.length + " fallidos");
              if (fallos.length) {
                console.error("Fallaron: " + fallos.join(", "));
                process.exit(1);
              }
          '

      - name: Commit reportes y deploymentIds
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/clientes.json deploy/REPORT.md
          git diff --cached --quiet || git commit -m "reporte: actualizar clientes"
          git push
