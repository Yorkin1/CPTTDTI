name: Actualizar copias de clientes

on:
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp

      - name: Restaurar credenciales de clasp
        run: |
          echo "$CLASP_CREDENTIALS" > /tmp/clasp-raw.json
          node --input-type=commonjs -e '
            const fs = require("fs");
            const os = require("os");
            const raw = JSON.parse(fs.readFileSync("/tmp/clasp-raw.json", "utf8"));
            let output;
            if (raw.tokens && raw.tokens.default) {
              output = { token: raw.tokens.default };
            } else if (raw.token) {
              output = raw;
            } else {
              output = raw;
            }
            const homeDir = os.homedir();
            const outPath = homeDir + "/.clasprc.json";
            fs.writeFileSync(outPath, JSON.stringify(output));
            console.log("HOME=" + homeDir);
            console.log("Escrito en: " + outPath);
            console.log("Existe: " + fs.existsSync(outPath));
            console.log("Token presente: " + !!output.token);
          '
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Verificar clasprc.json
        run: |
          echo "HOME=$HOME"
          echo "Archivo existe:"
          ls -la ~/.clasprc.json 2>&1 || echo "NO EXISTE"
          echo "Contenido (sin tokens):"
          node --input-type=commonjs -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(require("os").homedir()+"/.clasprc.json","utf8"));console.log("Keys:",Object.keys(c));console.log("Token keys:",Object.keys(c.token||{}))'

      - name: Generar appsscript.json
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const manifest = {
              timeZone: "America/Santo_Domingo",
              dependencies: {},
              exceptionLogging: "STACKDRIVER",
              runtimeVersion: "V8",
              oauthScopes: [
                "https://www.googleapis.com/auth/spreadsheets",
                "https://www.googleapis.com/auth/calendar",
                "https://www.googleapis.com/auth/drive",
                "https://www.googleapis.com/auth/documents",
                "https://www.googleapis.com/auth/script.send_mail",
                "https://www.googleapis.com/auth/script.container.ui",
                "https://www.googleapis.com/auth/userinfo.email"
              ],
              webapp: {
                executeAs: "USER_DEPLOYING",
                access: "ANYONE"
              },
              executionApi: {
                access: "MYSELF"
              }
            };
            fs.writeFileSync("./src/appsscript.json", JSON.stringify(manifest, null, 2));
          '

      - name: Empujar a cada cliente activo
        run: |
          node --input-type=commonjs -e '
            const clientes = require("./deploy/clientes.json");
            const { execSync } = require("child_process");
            const fs = require("fs");
            let fallos = [];
            let exitosos = [];
            for (const c of clientes) {
              if (!c.activo) {
                console.log("⊘ " + c.slug + " (inactivo, saltando)");
                continue;
              }
              console.log("→ " + c.slug);
              fs.writeFileSync(".clasp.json", JSON.stringify({
                scriptId: c.scriptId,
                rootDir: "./src",
                scriptExtensions: [".js", ".gs"],
                htmlExtensions: [".html"],
                jsonExtensions: [".json"],
                filePushOrder: [],
                skipSubdirectories: false
              }, null, 2));
              try {
                execSync("clasp push -f", { stdio: "inherit" });
                execSync("clasp deploy -i " + c.deploymentId + " -d \"auto: " + (process.env.GITHUB_SHA || "").slice(0,7) + "\"", { stdio: "inherit" });
                console.log("✓ " + c.slug + " actualizado");
                exitosos.push(c.slug);
              } catch (e) {
                console.error("✗ Falló " + c.slug);
                fallos.push(c.slug);
              }
            }
            console.log("");
            console.log("Resumen: " + exitosos.length + " exitosos, " + fallos.length + " fallidos");
            if (fallos.length) {
              console.error("Fallaron: " + fallos.join(", "));
              process.exit(1);
            }
          '
