name: Actualizar copias de clientes

on:
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp
      - run: npm install googleapis

      - name: Restaurar credenciales de clasp
        run: node deploy/restaurar-credenciales.js
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Generar appsscript.json
        run: node deploy/generar-manifest.js

      - name: Empujar a cada cliente activo
        run: node deploy/actualizar-clientes.js

      - name: Commit reportes y deploymentIds
        if: always()
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add deploy/clientes.json deploy/REPORT.md
          git diff --cached --quiet || git commit -m "reporte: actualizar clientes"
          git push
