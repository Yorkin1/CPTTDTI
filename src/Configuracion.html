<div class="cabecera-vista">
  <h1>Configuración</h1>
  <p>Personalice los valores generales del sistema. Los cambios se aplican de inmediato.</p>
</div>

<div class="tarjeta">
  <h2>Datos del negocio</h2>
  <form id="formConfiguracionGeneral">
    <div class="grid-form">
      <div class="campo ancho-completo">
        <label for="cfg2_logo_archivo">Logo del negocio</label>
        <input type="file" id="cfg2_logo_archivo" accept="image/png,image/jpeg,image/gif,image/webp">
        <img id="cfg2_logo_preview" class="foto-preview logo-preview" alt="Vista previa del logo" style="display:none;">
        <button type="button" class="btn btn-secundario btn-pequeno" id="cfg2_logo_quitar" style="display:none;">Quitar logo</button>
        <p class="asistente-nota">Se muestra arriba a la izquierda, antes del nombre del negocio.</p>
      </div>
      <div class="campo">
        <label for="cfg2_nombre_negocio">Nombre del negocio *</label>
        <input type="text" id="cfg2_nombre_negocio" required placeholder="Ej. Ferretería Don Juan"> 
      </div>
      <div class="campo">
        <label for="cfg2_mensaje_bienvenida">Mensaje de bienvenida</label>
        <input type="text" id="cfg2_mensaje_bienvenida" placeholder="Ej. ¡Gracias por venir! Tip: saluda al cliente">
      </div>
      <div class="campo">
        <label for="cfg2_etiqueta_cita">Etiqueta de cita</label>
        <input type="text" id="cfg2_etiqueta_cita" placeholder="Ej. Cita, Consulta, Visita">
      </div>
      <div class="campo">
        <label for="cfg2_duracion_cita_def">Duración predeterminada de cita (minutos)</label>
        <input type="number" id="cfg2_duracion_cita_def" min="5" step="5" placeholder="Ej. 60">
      </div>
      <div class="campo">
        <label for="cfg2_color_primario">Color primario</label>
        <input type="color" id="cfg2_color_primario">
      </div>
      <div class="campo">
        <label for="cfg2_color_secundario">Color secundario</label>
        <input type="color" id="cfg2_color_secundario">
      </div>
      <div class="campo">
        <label for="cfg2_tema">Tema</label>
        <select id="cfg2_tema">
          <option value="claro">Claro</option>
          <option value="oscuro">Oscuro</option>
        </select>
      </div>
      <div class="campo ancho-completo">
        <label style="font-weight:600; cursor:pointer;">
          <input type="checkbox" id="cfg2_monitor_habilitar" style="width:auto; margin-right:8px; accent-color:var(--color-primario);">
          Habilitar monitor de actividad del dueño
        </label>
        <p class="asistente-nota">Registra todas las acciones de los usuarios en una vista exclusiva para usted (pestaña "Monitor").</p>
      </div>
    </div>
  </form>
</div>

<div class="acciones-form" style="margin-bottom:22px;">
  <button type="button" class="btn btn-primario" id="btnGuardarConfiguracionGeneral">Guardar configuración</button>
</div>
