<div class="cabecera-vista">
  <h1><span data-et="citas">Citas</span></h1>
  <p>Agende <span data-et="citas_min">citas</span> y genere automáticamente un evento en Google Calendar.</p>
</div>

<!-- Formulario para agendar cita -->
<div class="tarjeta">
  <h2 id="tituloFormCita">Agendar <span data-et="cita_nueva">nueva cita</span></h2>
  <form id="formCita">
    <input type="hidden" id="citaId" value="">
    <div class="grid-form">
      <div class="campo">
        <label for="cita_cliente">Cliente <span class="req">*</span></label>
        <select id="cita_cliente" required>
          <option value="">— Seleccione un cliente —</option>
        </select>
      </div>
      <div class="campo ancho-completo">
        <label for="cita_titulo">Título <span class="req">*</span></label>
        <input type="text" id="cita_titulo" required placeholder="Ej. Reunión, revisión, consulta…">
      </div>
      <div class="campo">
        <label for="cita_fecha">Fecha <span class="req">*</span></label>
        <input type="date" id="cita_fecha" required>
      </div>
      <div class="campo">
        <label for="cita_hora">Hora <span class="req">*</span></label>
        <input type="time" id="cita_hora" required>
      </div>
      <div class="campo ancho-completo">
        <div class="encabezado-plegable">
          <label for="cita_servicios">Servicios</label>
          <button type="button" class="btn btn-secundario btn-pequeno" id="btnToggleServiciosCita">Mostrar servicios</button>
        </div>
        <div id="cita_servicios" class="servicios-cita colapsado"></div>
        <input type="hidden" id="cita_duracion" value="60">
        <p class="ayuda" id="cita_duracion_mostrar">Duración: 1 h</p>
      </div>
      <div class="campo ancho-completo">
        <label for="cita_descripcion">Descripción</label>
        <textarea id="cita_descripcion"></textarea>
      </div>
    </div>
    <div class="acciones-form">
      <button type="submit" class="btn btn-primario" id="btnGuardarCita">Agendar cita</button>
      <button type="button" class="btn btn-secundario" id="btnCancelarCita" style="display:none;">Cancelar</button>
    </div>
  </form>
</div>

<!-- Listado de citas -->
<div class="tarjeta">
  <div class="cabecera-lista">
    <h2><span data-et="citas">Citas</span> registradas <button type="button" id="contadorHoy" class="etiqueta etiqueta-programada" title="Filtrar las de hoy" style="cursor:pointer; border:none; font:inherit;">Hoy: 0</button></h2>
    <button type="button" class="btn btn-secundario btn-pequeno btn-refrescar" title="Refrescar lista" onclick="refrescarLista('citas')">↻ Refrescar</button>
  </div>
  <div class="barra-busqueda">
    <input type="text" id="buscarCita" placeholder="Buscar por título o cliente…">
    <input type="date" id="filtroFechaCita" title="Filtrar por día" required>
    <select id="filtroEstadoCita">
      <option value="">Todos los estados</option>
      <option value="Programada">Programada</option>
      <option value="Completada">Completada</option>
      <option value="Expirada">Expirada</option>
    </select>
    <button type="button" class="btn btn-secundario btn-pequeno" id="btnQuitarFiltrosCita" title="Quitar filtros" style="margin-left:auto; display:none;">Quitar filtros</button>
  </div>
  <div class="tabla-contenedor">
    <table class="tabla-citas">
      <thead>
        <tr>
          <th class="col-check" title="Completada"></th>
          <th>Título</th>
          <th class="col-cliente">Cliente</th>
          <th>Agendado por</th>
          <th>Fecha</th>
          <th>Hora</th>
        <th>Duración</th>
        <th>Total</th>
          <th class="col-servicios">Servicios</th>
        <th class="col-estado">Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaCitas">
      <tr><td colspan="11" class="cargando">Cargando…</td></tr>
    </tbody>
    </table>
  </div>
</div>

<!-- Confirmación para enviar el aviso por WhatsApp (con vista previa del mensaje) -->
<div id="modalAvisoWhatsApp" class="modal-fondo" style="display:none;">
  <div class="modal">
    <div class="modal-cabecera">
      <h2>Cita actualizada</h2>
      <button type="button" class="modal-cerrar" id="btnCerrarModalWhatsApp" aria-label="Cerrar">&times;</button>
    </div>
    <p id="textoModalWhatsApp" style="color:var(--gris-texto); margin-bottom:10px;"></p>
    <div id="vistaPreviaWhatsApp" style="background:var(--azul-muy-claro); border-left:4px solid var(--color-primario); border-radius:8px; padding:12px 16px; margin-bottom:4px;"></div>
    <div class="acciones-form">
      <button type="button" class="btn btn-primario" id="btnEnviarWhatsApp">Enviar por WhatsApp</button>
      <button type="button" class="btn btn-secundario" id="btnOmitirWhatsApp">Ahora no</button>
    </div>
  </div>
</div>
