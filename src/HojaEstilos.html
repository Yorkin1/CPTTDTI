<style>
  /* ============================================================
     Hoja de estilos — Gestor de Clientes y Citas
     Paleta profesional (azules / blancos), diseño responsivo.
     ============================================================ */

  :root {
    --azul-oscuro: #1e3a8a;
    --azul: #1e40af;
    --azul-claro: #3b82f6;
    --azul-muy-claro: #eff6ff;
    --gris-fondo: #f4f6fb;
    --gris-borde: #e2e8f0;
    --gris-texto: #475569;
    --texto: #1e293b;
    --blanco: #ffffff;
    --verde: #16a34a;
    --rojo: #dc2626;
    --amarillo: #d97706;
    --sombra: 0 2px 8px rgba(30, 58, 138, 0.08);
    --sombra-media: 0 4px 16px rgba(30, 58, 138, 0.12);
    --radio: 12px;
    /* Colores configurables por el usuario (se aplican desde JS). */
    --color-primario: #4285F4;
    --color-secundario: #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--gris-fondo);
    color: var(--texto);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Barra de navegación ---------- */
  .navbar {
    background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-claro));
    color: var(--blanco);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 28px;
    padding: 0 20px;
    height: 62px;
    box-shadow: var(--sombra-media);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar-marca { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .titulo-app { font-size: 19px; font-weight: 600; letter-spacing: 0.2px; }
  .logo-negocio {
    height: 34px;
    width: 34px;
    object-fit: cover;
    border-radius: 50%;
    background: transparent;
    flex-shrink: 0;
  }
  .navbar-enlaces { display: flex; gap: 10px; }
  .nav-enlace {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 15px;
    transition: background 0.2s, color 0.2s;
  }
  .nav-enlace:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  .nav-enlace.activo { background: rgba(255, 255, 255, 0.22); color: #fff; }
  .menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
  }

  /* ---------- Contenedor principal ---------- */
  .contenedor {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 26px 18px;
  }

  .cabecera-vista { margin-bottom: 20px; }
  .cabecera-vista h1 {
    font-size: 26px;
    color: var(--azul-oscuro);
    margin-bottom: 4px;
  }
  .cabecera-vista p { color: var(--gris-texto); font-size: 15px; }

  /* ---------- Tarjetas ---------- */
  .tarjeta {
    background: var(--blanco);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 22px;
    margin-bottom: 22px;
    border: 1px solid var(--gris-borde);
  }
  .tarjeta h2 {
    font-size: 18px;
    color: var(--azul-oscuro);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--azul-muy-claro);
  }

  /* ---------- Formularios ---------- */
  .grid-form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .campo { display: flex; flex-direction: column; }
  .campo.ancho-completo { grid-column: 1 / -1; }
  .campo label {
    font-size: 13px;
    font-weight: 600;
    color: var(--gris-texto);
    margin-bottom: 5px;
  }
  .campo input,
  .campo select,
  .campo textarea {
    padding: 10px 12px;
    border: 1px solid var(--gris-borde);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    transition: border 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .campo input:focus,
  .campo select:focus,
  .campo textarea:focus {
    outline: none;
    border-color: var(--color-primario);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .campo textarea { resize: vertical; min-height: 70px; }
  .ayuda { font-size: 12px; color: var(--gris-texto); margin-top: 4px; }
  .duracion-stepper { position: relative; }
  .duracion-stepper input { padding-right: 30px; width: 100%; }
  .duracion-flechas {
    position: absolute;
    right: 1px;
    top: 1px;
    bottom: 1px;
    width: 24px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--gris-borde);
    border-radius: 0 7px 7px 0;
    overflow: hidden;
  }
  .duracion-flechas button {
    flex: 1;
    border: none;
    background: #f8fafc;
    color: var(--gris-texto);
    font-size: 8px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .duracion-flechas button:hover { background: #e2e8f0; color: var(--color-primario); }
  .duracion-flechas button:first-child { border-bottom: 1px solid var(--gris-borde); }
  body.tema-oscuro .duracion-flechas button { background: #1e293b; }
  body.tema-oscuro .duracion-flechas button:hover { background: #334155; }

  /* ---------- Combobox / selects (mejor diseño) ---------- */
  select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'%3E%3Cpath fill='%2364748b' d='M4.6 6.2 8 9.6l3.4-3.4 1 1-4.4 4.4L3.6 7.2z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    padding-right: 34px;
    cursor: pointer;
    color: var(--texto);
    border-radius: 10px;
  }
  select:hover { border-color: var(--color-primario); }
  select:focus {
    outline: none;
    border-color: var(--color-primario);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  select option {
    color: var(--texto);
    background: #fff;
    padding: 8px;
  }

  /* Selector de filtro dentro de la barra de búsqueda (p. ej. estado de citas). */
  .barra-busqueda select {
    padding: 10px 34px 10px 12px;
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background-color: #fff;
    cursor: pointer;
  }
  .barra-busqueda select:focus {
    outline: none;
    border-color: var(--color-primario);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }

  .acciones-form {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ---------- Botones ---------- */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.2s, background 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primario { background: var(--azul); color: #fff; }
  .btn-primario:hover { background: var(--azul-oscuro); }
  .btn-secundario { background: #e2e8f0; color: var(--texto); }
  .btn-secundario:hover { background: #cbd5e1; }
  .btn-peligro { background: var(--rojo); color: #fff; }
  .btn-peligro:hover { background: #b91c1c; }
  .btn-pequeno { padding: 6px 12px; font-size: 13px; }
  .btn-refrescar { white-space: nowrap; }

  /* Enlace con aspecto de botón: se alinea y centra igual que un <button>. */
  a.btn {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  /* Cabecera de listado con botón de refrescar a la derecha */
  .cabecera-lista {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--azul-muy-claro);
  }
  .cabecera-lista h2 {
    margin: 0;
    font-size: 18px;
    color: var(--azul-oscuro);
  }

  /* ---------- Tablas ---------- */
  .tabla-area { position: relative; }
  .tabla-contenedor { overflow-x: auto; position: relative; }
  table {
    width: 100%;
    min-width: 950px;
    border-collapse: collapse;
    font-size: 14px;
    border: 1px solid var(--gris-borde);
    border-radius: var(--radio);
    overflow: hidden;
  }
  thead th {
    background: var(--azul-muy-claro);
    color: var(--azul-oscuro);
    text-align: left;
    padding: 11px 12px;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 2px solid var(--gris-borde);
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gris-borde);
    vertical-align: middle;
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: #f8fafc; }
  tbody tr:hover { background: #eef2ff; }
  .col-wrap { white-space: normal; word-break: break-word; min-width: 180px; }
  .col-estado { text-align: center; }
  .col-cliente { min-width: 150px; max-width: 220px; white-space: normal; overflow-wrap: break-word; }
  .col-servicios { min-width: 150px; max-width: 220px; white-space: normal; overflow-wrap: break-word; }
  .acciones-fila { display: flex; gap: 6px; white-space: nowrap; }
  .vacio-accion { color: var(--gris-texto); }
  .col-check { width: 40px; text-align: center; }
  .check-completar {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--color-primario);
  }
  .fila-completada td { opacity: .65; }
  .fila-completada td:first-child { opacity: 1; }

  /* ---------- Sesión (barra superior) ---------- */
  .nav-sesion {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    padding: 0 8px;
  }
  .nombre-sesion {
    font-size: 13px;
    color: var(--blanco);
    white-space: nowrap;
  }

  /* ---------- Menú desplegable del usuario ---------- */
  .menu-usuario { position: relative; }
  .menu-usuario-boton {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
    font-family: inherit;
  }
  .menu-usuario-boton:hover { background: rgba(0, 0, 0, 0.06); }
  .avatar-usuario {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--color-primario);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .flecha-usuario { font-size: 10px; color: #94a3b8; }
  .menu-usuario-lista {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 190px;
    background: var(--blanco);
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    box-shadow: var(--sombra-media);
    padding: 6px;
    z-index: 150;
  }
  .menu-usuario-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-size: 14px;
    color: var(--texto);
    cursor: pointer;
    font-family: inherit;
  }
  .menu-usuario-item:hover { background: var(--azul-muy-claro); }
  .menu-usuario-item-peligro { color: var(--rojo); }
  .menu-usuario-item-peligro:hover { background: #fee2e2; }
  .menu-usuario-separador {
    height: 1px;
    background: var(--gris-borde);
    margin: 5px 8px;
  }

  /* ---------- Fotos ---------- */
  .foto-mini {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .foto-preview {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-top: 8px;
    border: 1px solid var(--gris-borde);
    object-fit: cover;
  }
  .foto-cliente-editor {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
  }
  .foto-cliente-editor .foto-preview { margin-top: 0; }
  .foto-cliente-botones {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .logo-preview {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    background: #fff;
  }

  /* ---------- Buscador / filtros ---------- */
  .barra-busqueda {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 18px;
  }
  .barra-busqueda label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #64748b;
  }
  .barra-busqueda label select,
  .barra-busqueda label input {
    flex: initial;
    width: auto;
    min-width: 165px;
  }
  .barra-busqueda input {
    padding: 10px 14px;
    border: 1px solid var(--gris-borde);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .barra-busqueda input:focus {
    outline: none;
    border-color: var(--azul-claro);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .acciones-lista {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .menu-exportar { position: relative; }
  .etiqueta-alcance {
    font-size: 12px;
    color: var(--texto-secundario);
    margin-right: 8px;
    align-self: center;
  }
  .menu-exportar-lista {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 170px;
    background: var(--blanco);
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    box-shadow: var(--sombra-media);
    padding: 6px;
    z-index: 150;
  }
  .menu-exportar-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-size: 14px;
    color: var(--texto);
    cursor: pointer;
    font-family: inherit;
  }
  .menu-exportar-item:hover { background: var(--azul-muy-claro); }

  /* ---------- Etiquetas de estado ---------- */
  .etiqueta {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .etiqueta-programada { background: #dbeafe; color: var(--azul-oscuro); }
  .etiqueta-completada { background: #dcfce7; color: var(--verde); }
  .etiqueta-expirada { background: #e2e8f0; color: var(--gris-texto); }
  .fila-expirada td { opacity: .5; }
  .fila-expirada .check-completar { opacity: .5; }

  /* ---------- Estados vacíos / carga ---------- */
  .vacio, .cargando {
    text-align: center;
    padding: 34px 16px;
    color: var(--gris-texto);
    font-size: 15px;
  }
  .cargando::after {
    content: '';
    display: inline-block;
    width: 16px; height: 16px;
    margin-left: 8px;
    border: 2px solid var(--gris-borde);
    border-top-color: var(--azul-claro);
    border-radius: 50%;
    animation: girar 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--texto);
    color: #fff;
    padding: 13px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--sombra-media);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 200;
    max-width: 90%;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.exito { background: var(--verde); }
  .toast.error { background: var(--rojo); }
  .toast.aviso { background: #f59e0b; }

  /* ---------- Carga acotada a la tabla de una lista ---------- */
  .spinner-carga {
    width: 36px; height: 36px;
    margin: 0 auto;
    border: 3px solid var(--gris-borde);
    border-top-color: var(--color-primario);
    border-radius: 50%;
    animation: girar 0.7s linear infinite;
    display: block;
  }
  .carga-zona {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--blanco);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    z-index: 10;
  }
  .carga-zona-contenido { text-align: center; }
  .carga-zona-contenido p {
    margin-top: 10px;
    color: var(--gris-texto);
    font-size: 13px;
    font-weight: 500;
  }
  body.tema-oscuro .carga-zona { background: var(--blanco); }
  body.tema-oscuro .carga-zona-contenido p { color: #cbd5e1; }

  /* ---------- Pie ---------- */
  .pie {
    text-align: center;
    padding: 16px;
    color: var(--gris-texto);
    font-size: 13px;
    border-top: 1px solid var(--gris-borde);
    background: var(--blanco);
  }

  /* ---------- Responsivo ---------- */
  body { overflow-x: hidden; }
  @media (max-width: 720px) {
    .grid-form { grid-template-columns: 1fr; }
    .titulo-app { font-size: 17px; }
    .logo-negocio { height: 26px; width: 26px; }
    .menu-toggle { display: block; }
    .navbar-enlaces {
      position: absolute;
      top: 62px;
      left: auto;
      right: 8px;
      flex-direction: column;
      background: var(--color-primario);
      padding: 8px 14px;
      gap: 2px;
      display: none;
      width: min(240px, 90vw);
      border-radius: 8px;
      box-shadow: var(--sombra-media);
    }
    .navbar-enlaces.abierto { display: flex; }
    .nav-enlace { padding: 12px 14px; }
    .navbar { gap: 12px; padding: 0 12px; }
    .menu-usuario-boton .nombre-sesion { display: none; }
    .contenedor { padding: 18px 12px; }
    .tarjeta { padding: 14px; }
    .barra-busqueda { flex-direction: column; align-items: stretch; }
    .cabecera-lista { flex-wrap: wrap; gap: 8px; }
    .tabla-contenedor { -webkit-overflow-scrolling: touch; }
    thead th, tbody td { padding: 8px 10px; }
    .tabla-contenedor input[type="time"] { width: 100px !important; }
  }
  @media (max-width: 360px) {
    thead th, tbody td { padding: 7px 8px; font-size: 13px; }
    .btn { padding: 9px 14px; }
    .asistente { padding: 20px 10px; }
    .asistente-tarjeta { padding: 20px 16px; }
    .modal { padding: 18px; }
  }

  /* ============================================================
     Personalización dinámica (color primario configurable)
     ============================================================ */
  .navbar {
    background: linear-gradient(135deg, var(--color-primario), var(--color-primario));
  }
  .btn-primario { background: var(--color-primario); }
  .btn-primario:hover { filter: brightness(0.92); background: var(--color-primario); }
  .cabecera-vista h1 { color: var(--color-primario); }
  .tarjeta h2 { color: var(--color-primario); }
  thead th { color: var(--color-primario); }

  /* ---------- Pantalla de carga inicial ---------- */
  .pantalla-carga {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--gris-fondo);
    z-index: 300;
  }

  /* ---------- Banner de bienvenida ---------- */
  .banner-bienvenida {
    max-width: 1080px;
    margin: 18px auto 0;
    padding: 12px 18px;
    background: var(--azul-muy-claro);
    color: var(--texto);
    border-left: 4px solid var(--color-primario);
    border-radius: 8px;
    font-size: 15px;
  }

  /* ---------- Asistente de configuración inicial ---------- */
  .asistente {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    background: linear-gradient(135deg, #eef2ff, #f4f6fb);
  }
  .asistente-tarjeta {
    background: var(--blanco);
    border-radius: var(--radio);
    box-shadow: var(--sombra-media);
    padding: 30px;
    width: 100%;
    max-width: 640px;
    border: 1px solid var(--gris-borde);
  }
  .asistente-cabecera { text-align: center; margin-bottom: 22px; }
  .asistente-cabecera h1 { font-size: 24px; color: var(--color-primario); margin-bottom: 6px; }
  .asistente-cabecera p { color: var(--gris-texto); font-size: 15px; }
  .asistente-nota { margin-top: 12px; font-size: 13px; color: var(--gris-texto); }
  .lista-pasos { margin: 14px 0 0 0; padding-left: 20px; line-height: 1.7; text-align: left; }
