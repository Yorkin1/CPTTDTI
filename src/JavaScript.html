  // Horario de atención predeterminado (getDay: 0=Domingo...6=Sábado).
  function _horarioAtencionDefault() {
    return {
      0: { abre: '', cierra: '' },
      1: { abre: '09:00', cierra: '17:00' },
      2: { abre: '09:00', cierra: '17:00' },
      3: { abre: '09:00', cierra: '17:00' },
      4: { abre: '09:00', cierra: '17:00' },
      5: { abre: '09:00', cierra: '17:00' },
      6: { abre: '09:00', cierra: '13:00' }
    };
  }

  // Rellena los campos de horario del formulario desde un objeto de configuración.
  function rellenarHorarioAtencion(horario) {
    for (var d = 0; d < 7; d++) {
      var dia = horario[d] || {};
      setVal('cfg2_res_d' + d + '_abre', dia.abre || '');
      setVal('cfg2_res_d' + d + '_cierra', dia.cierra || '');
      var chkCerrado = document.getElementById('cfg2_res_d' + d + '_cerrado');
      if (chkCerrado) chkCerrado.checked = !(dia.abre && dia.cierra);
    }
  }

  // Marcar "Cerrado" limpia el horario del día; desmarcar restaura el predeterminado.
  function iniciarDiasCerrados() {
    for (var d = 0; d < 7; d++) {
      var chk = document.getElementById('cfg2_res_d' + d + '_cerrado');
      if (!chk) continue;
      chk.addEventListener('change', function() {
        var idx = parseInt(this.id.replace(/[^0-9]/g, ''), 10);
        if (this.checked) {
          setVal('cfg2_res_d' + idx + '_abre', '');
          setVal('cfg2_res_d' + idx + '_cierra', '');
        } else {
          // Al desmarcar "Cerrado", el día queda abierto con el horario por
          // defecto real (nunca vacío, ni siquiera el domingo).
          var def = _horarioAtencionDefault()[idx] || {};
          var abre = def.abre || '09:00';
          var cierra = def.cierra || (idx === 6 ? '13:00' : '17:00');
          setVal('cfg2_res_d' + idx + '_abre', abre);
          setVal('cfg2_res_d' + idx + '_cierra', cierra);
        }
      });
    }
  }

  // Lee los campos de horario y devuelve el objeto para guardar en configuración.
  function leerHorarioAtencionFormulario() {
    var horario = {};
    for (var d = 0; d < 7; d++) {
      var chkCerrado = document.getElementById('cfg2_res_d' + d + '_cerrado');
      var cerrado = chkCerrado ? chkCerrado.checked : false;
      if (cerrado) {
        horario[d] = { abre: '', cierra: '' };
        continue;
      }
      var abre = document.getElementById('cfg2_res_d' + d + '_abre').value;
      var cierra = document.getElementById('cfg2_res_d' + d + '_cierra').value;
      horario[d] = { abre: abre || '', cierra: cierra || '' };
    }
    return horario;
  }

  // Rellena los campos de límite de citas por día de la semana.
  function rellenarLimitesPorDia(porSemana) {
    for (var d = 0; d <= 6; d++) {
      var el = document.getElementById('cfg2_res_limite_d' + d);
      if (!el) continue;
      el.value = (porSemana[d] !== undefined && porSemana[d] !== '' && parseInt(porSemana[d], 10) > 0)
        ? parseInt(porSemana[d], 10) : '';
    }
  }

  // Lee los límites de citas por día del formulario.
  function leerLimitesPorDiaFormulario() {
    var porSemana = {};
    for (var d = 0; d <= 6; d++) {
      var el = document.getElementById('cfg2_res_limite_d' + d);
      if (!el) continue;
      var val = parseInt(el.value, 10);
      if (!isNaN(val) && val > 0) {
        porSemana[d] = val;
      }
    }
    return porSemana;
  }

  function copiarTextoReservas(url) {
    if (!url) {
      mostrarToast('Primero despliegue la aplicación web (Implementar → Aplicación web).', 'error');
      return;
    }
    var aux = document.createElement('textarea');
    aux.value = url;
    aux.style.position = 'fixed';
    aux.style.opacity = '0';
    document.body.appendChild(aux);
    aux.select();
    try {
      document.execCommand('copy');
      mostrarToast('Enlace de reservas copiado.', 'exito');
    } catch (e) {
      mostrarToast(url, 'exito');
    }
    document.body.removeChild(aux);
    var hint = document.getElementById('reservasEnlaceHint');
    if (hint) hint.textContent = url;
  }

  document.addEventListener('DOMContentLoaded', function() {
    // Consultar el estado/configuración de la aplicación.
    google.script.run
      .withSuccessHandler(function(estado) {
        Estado.config = estado || Estado.config;
        // Aplicar colores y tema cuanto antes (también en el asistente/login).
        aplicarColorPrimario(Estado.config.colorPrimario);
        aplicarColorSecundario(Estado.config.colorSecundario);
        aplicarTema(Estado.config.tema);
        if (estado && estado.sinHoja) {
          // Copia sin vincular: falta ejecutar "Client Manager → Iniciar configuración".
          mostrarSinConfigurar();
          return;
        }
        if (Estado.config.configurada) {
          if (obtenerSesion()) {
            iniciarDashboard();
          } else {
            mostrarLogin();
          }
        } else {
          // Plantilla sin configurar: la configuración inicial ocurre DESPUÉS
          // del registro del primer admin (no hay asistente pre-login).
          var sesion = obtenerSesion();
          if (sesion && sesion.token && sesion.rol === 'administrador') {
            mostrarAsistenteInicial();
          } else if (sesion && sesion.token) {
            // Un editor no puede configurar el sistema.
            ocultar('pantallaCarga');
            mostrarLogin();
            mostrarToast('El administrador debe completar la configuración inicial antes de comenzar.', 'exito');
          } else {
            mostrarLogin();
          }
        }
      })
      .withFailureHandler(function(err) {
        // Si el error indica que no hay hoja vinculada, mostrar la pantalla
        // de "falta configurar"; en otro caso, el login/registro.
        ocultar('pantallaCarga');
        if (err && /no hay hoja de c.lculo configurada|iniciar configuraci.n/i.test(err.message || '')) {
          mostrarSinConfigurar();
          return;
        }
        mostrarLogin();
        mostrarToast('No se pudo cargar la configuración: ' + err.message, 'error');
      })
      .obtenerEstadoAplicacion();
  });

  // Pantalla "copia sin configurar": indica al usuario que debe ejecutar
  // "Client Manager → Iniciar configuración" en su copia de la hoja.

  /* -------------------- Sesión -------------------- */

  function obtenerSesion() {
    try {
      var raw = sessionStorage.getItem('sistemaUsuario');
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function guardarSesion(usuario, nombre, rol, token, principal) {
    sessionStorage.setItem('sistemaUsuario', JSON.stringify({
      usuario: usuario, nombre: nombre, rol: rol, token: token || '',
      principal: !!principal
    }));
  }

  // Devuelve true si la sesión actual corresponde al dueño (primer administrador).
  function esDuenoSesion() {
    var s = obtenerSesion();
    return !!s && s.rol === 'administrador' && s.principal === true;
  }

  // Token de sesión vigente (vacío si no hay sesión).
  function tokenSesion() {
    var s = obtenerSesion();
    return (s && s.token) || '';
  }

  // Si la respuesta del servidor indica sesión expirada, cierra la sesión
  // local, vuelve al login y devuelve true (el llamador debe detenerse).
  function sesionInvalida(resp) {
    if (resp && resp.sesionExpirada) {
      sessionStorage.removeItem('sistemaUsuario');
      ocultar('appPrincipal');
      mostrarLogin();
      mostrarToast('Su sesión expiró. Vuelva a iniciar sesión.', 'error');
      return true;
    }
    return false;
  }

  function cerrarSesion() {
    detenerChequeoCambios();
    var sesion = obtenerSesion();
    if (sesion && sesion.token) {
      google.script.run.cerrarSesion(sesion.token);
    }
    sessionStorage.removeItem('sistemaUsuario');
    ocultar('appPrincipal');
    mostrarLogin();
  }

  // Avisa al administrador cuando se registra alguien nuevo (desde la última
  // vez que se notificó). El control de "ya avisados" se guarda en el SERVIDOR
  // (PropertiesService), por lo que el aviso ocurre UNA sola vez por usuario
  // sin importar el navegador ni el dispositivo.
  function avisarNuevosUsuarios() {
    var sesion = obtenerSesion();
    if (!sesion || sesion.rol !== 'administrador') return;
    google.script.run
      .withSuccessHandler(function(resp) {
        if (sesionInvalida(resp)) return;
        if (!resp || !resp.exito || !resp.usuarios) return;
        var nuevos = resp.usuarios || [];
        if (nuevos.length === 0) return;
        var ids = nuevos.map(function(u) { return String(u.usuario); });
        var nombres = nuevos.map(function(u) { return (u.nombre || u.usuario); }).join(', ');
        google.script.run
          .withSuccessHandler(function() {})
          .withFailureHandler(function() {})
          .marcarUsuariosAvisados(tokenSesion(), ids);
        mostrarToast('Nuevo usuario registrado: ' + nombres, 'exito');
      })
      .withFailureHandler(function() {})
      .obtenerUsuariosNuevos(tokenSesion());
  }

  function mostrarLogin() {
    detenerChequeoCambios();
    ocultar('pantallaCarga');
    ocultar('asistenteInicial');
    ocultar('appPrincipal');
    mostrar('pantallaLogin');
    var form = document.getElementById('formLogin');
    if (!form.getAttribute('data-vinculado')) {
      form.setAttribute('data-vinculado', '1');
      form.addEventListener('submit', iniciarSesion);
      document.getElementById('formRegistro').addEventListener('submit', registrarCuenta);
      document.getElementById('formRecuperar').addEventListener('submit', recuperarContrasenaCuenta);
      document.getElementById('enlaceRegistro').addEventListener('click', function(e) {
        e.preventDefault();
        alternarFormAcceso(true);
      });
      document.getElementById('enlaceInicio').addEventListener('click', function(e) {
        e.preventDefault();
        alternarFormAcceso(false);
      });
      document.getElementById('enlaceRecuperar').addEventListener('click', function(e) {
        e.preventDefault();
        mostrarFormRecuperar(true);
      });
      document.getElementById('enlaceVolverLogin').addEventListener('click', function(e) {
        e.preventDefault();
        mostrarFormRecuperar(false);
      });
    }
  }

  // Muestra el formulario de recuperación (ocultando login/registro).

  function registrarCuenta(e) {
    e.preventDefault();
    var nombre = document.getElementById('reg_nombre').value.trim();
    var correo = document.getElementById('reg_correo').value.trim();
    var contrasena = document.getElementById('reg_contrasena').value;
    var confirmarContrasena = document.getElementById('reg_contrasena_confirmar').value;
    if (contrasena !== confirmarContrasena) {
      mostrarToast('Las contraseñas no coinciden.', 'error');
      return;
    }
    var btn = document.getElementById('btnRegistrar');
    btn.disabled = true;
    btn.textContent = 'Creando cuenta…';
    google.script.run

        btn.disabled = false;

  // Guarda la configuración inicial (el sistema queda CONFIGURADA = SI).
  function guardarAsistenteInicialConfiguracion(e) {
    e.preventDefault();
    var nombreNegocio = document.getElementById('cfg_nombre_negocio').value.trim();
    if (!nombreNegocio) {
      mostrarToast('El nombre del negocio es obligatorio.', 'error');
      marcarCampo('cfg_nombre_negocio', false);
      document.getElementById('cfg_nombre_negocio').focus();
      return;
    }

    var datos = {
      NOMBRE_NEGOCIO: nombreNegocio,
      MENSAJE_BIENVENIDA: document.getElementById('cfg_mensaje_bienvenida').value.trim() ||
        'Bienvenido a nuestro sistema de gestión',
      ETIQUETA_CITA: document.getElementById('cfg_etiqueta_cita').value.trim() || 'Cita',
      COLOR_PRIMARIO: document.getElementById('cfg_color_primario').value || '#4285F4',
      COLOR_SECUNDARIO: document.getElementById('cfg_color_secundario').value || '#16a34a',
      TEMA: document.getElementById('cfg_tema').value || 'claro',
      HABILITAR_MONITOR: document.getElementById('cfg_monitor_habilitar').checked ? 'SI' : 'NO'
    };

    var btn = document.getElementById('btnGuardarConfiguracionInicial');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    // Si se eligió un logo nuevo, se lee como data URL antes de enviar.
    var archivoLogo = document.getElementById('cfg_logo_archivo').files[0];
    if (archivoLogo) {
      var lector = new FileReader();
      lector.onload = function() {
        datos.logoDataUrl = lector.result;
        enviarGuardarAsistenteInicial(datos, btn);
      };
      lector.onerror = function() {
        btn.disabled = false;
        btn.textContent = 'Guardar y comenzar';
        mostrarToast('No se pudo leer la imagen del logo.', 'error');
      };
      lector.readAsDataURL(archivoLogo);
    } else {
      if (Estado.logoEliminado) datos.eliminarLogo = true;
      enviarGuardarAsistenteInicial(datos, btn);
    }
  }

  function enviarGuardarAsistenteInicial(datos, btn) {
    google.script.run
      .withSuccessHandler(function(respuesta) {
        btn.disabled = false;
        btn.textContent = 'Guardar y comenzar';
        if (respuesta && respuesta.exito) {
          // Recargar el estado y entrar al dashboard ya configurado.
          google.script.run
            .withSuccessHandler(function(estado) {
              Estado.config = estado || Estado.config;
              aplicarColorPrimario(Estado.config.colorPrimario);
              aplicarColorSecundario(Estado.config.colorSecundario);
              aplicarTema(Estado.config.tema);
              ocultar('asistenteInicial');
              iniciarDashboard();
              mostrarToast('¡Configuración completada! Bienvenido a su sistema.', 'exito');
              if (respuesta.avisoCorreo) mostrarToast(respuesta.avisoCorreo, 'aviso');
            })
            .withFailureHandler(function(err) {
              mostrarToast('Error al recargar la configuración: ' + err.message, 'error');
            })
            .obtenerEstadoAplicacion();
        } else {
          mostrarToast((respuesta && respuesta.mensaje) || 'No se pudo guardar la configuración.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Guardar y comenzar';
        mostrarToast('Error al guardar: ' + err.message, 'error');
      })
      .guardarConfiguracion(tokenSesion(), datos);
  }

  /* -------------------- Dashboard -------------------- */

  // Carga la configuración, los clientes y las citas en UNA sola llamada al
  // servidor (menos invocaciones = arranque más rápido). Puebla el estado en
  // memoria para que las vistas se dibujen al instante.
  function cargarDatosIniciales(callback) {
    google.script.run
      .withSuccessHandler(function(resp) {
        if (sesionInvalida(resp)) { if (typeof callback === 'function') callback(false); return; }
        if (!resp || !resp.exito) {
          mostrarToast((resp && resp.mensaje) || 'No se pudieron cargar los datos.', 'error');
          if (typeof callback === 'function') callback(false);
          return;
        }
        Estado.config = resp.config || Estado.config;
        Estado.clientes = resp.clientes || [];
        Estado.clientesCargados = true;
        Estado.citas = resp.citas || [];
        Estado.citasCargados = true;
        aplicarConfiguracionGlobal();
        if (typeof callback === 'function') callback(true);
      })
      .withFailureHandler(function(err) {
        mostrarToast('Error al cargar los datos: ' + err.message, 'error');
        if (typeof callback === 'function') callback(false);
      })
      .obtenerDatosIniciales(tokenSesion());
  }

  // Repinta la barra superior con los datos de la sesión actual (nombre,
  // avatar y visibilidad de las pestañas de administrador). Se usa al iniciar
  // el dashboard y tras editar los datos del propio usuario.
  function actualizarBarraSesion() {
    var sesion = obtenerSesion();
    if (!sesion) return;
    var navSesion = document.getElementById('navSesion');
    if (navSesion) navSesion.style.display = 'flex';
    var nombreSesion = document.getElementById('nombreSesion');
    if (nombreSesion) {
      nombreSesion.textContent = sesion.nombre + (sesion.rol === 'administrador' ? ' · Admin' : '');
    }
    var avatar = document.getElementById('avatarUsuario');
    if (avatar) avatar.textContent = (sesion.nombre || '?').trim().charAt(0);
    var navUsuarios = document.getElementById('navUsuarios');
    if (navUsuarios) navUsuarios.style.display = sesion.rol === 'administrador' ? 'inline-block' : 'none';
    var navConfiguracion = document.getElementById('navConfiguracion');
    if (navConfiguracion) navConfiguracion.style.display = sesion.rol === 'administrador' ? 'inline-block' : 'none';
    var navMonitor = document.getElementById('navMonitor');
    if (navMonitor) navMonitor.style.display =
      (esDuenoSesion() && Estado.config && Estado.config.habilitarMonitor === true) ? 'inline-block' : 'none';
  }

  function iniciarDashboard() {
    ocultar('pantallaCarga');
    ocultar('asistenteInicial');
    ocultar('pantallaLogin');
    mostrar('appPrincipal');

    aplicarConfiguracionGlobal();

    // Chequeo silencioso de cambios externos (se agregó un cliente o se
    // registró una cita, p. ej. desde la página pública de reservas).
    // Solo refresca la vista abierta cuando la firma cambió de verdad.
    if (window._intervaloFirma) clearInterval(window._intervaloFirma);
    window._firmaCambios = null;
    window._intervaloFirma = setInterval(chequearCambios, 30000);
    // Al volver a la pestaña se comprueba de inmediato si hubo cambios (p. ej.
    // una reserva hecha en otra pestaña/equipo), sin esperar al siguiente timer.
    if (!window._vinculadoVisibilidad) {
      window._vinculadoVisibilidad = true;
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) return;
        var s = obtenerSesion();
        if (s && s.token) chequearCambios();
      });
    }

    // Mostrar la sesión actual (usuario/rol) y el enlace Usuarios solo para admin.
    actualizarBarraSesion();

    // Vincular eventos una sola vez (evita duplicados tras salir/volver a entrar).
    if (!document.body.getAttribute('data-vinculado')) {
      document.body.setAttribute('data-vinculado', '1');

      // Enlaces de navegación.
      var enlaces = document.querySelectorAll('.nav-enlace');
      for (var i = 0; i < enlaces.length; i++) {
        enlaces[i].addEventListener('click', function(e) {
          e.preventDefault();
          irAVista(this.dataset.vista);
        });
      }

      // Botón de menú móvil.
      document.getElementById('menuToggle').addEventListener('click', function() {
        document.getElementById('navEnlaces').classList.toggle('abierto');
      });

      // Cerrar sesión.
      document.getElementById('btnSalir').addEventListener('click', cerrarSesion);

      // Menú desplegable del usuario (cambiar contraseña / salir).
      var btnMenuUsuario = document.getElementById('btnMenuUsuario');
      var menuUsuarioLista = document.getElementById('menuUsuarioLista');
      if (btnMenuUsuario && menuUsuarioLista) {
        btnMenuUsuario.addEventListener('click', function(e) {
          e.stopPropagation();
          var abierto = menuUsuarioLista.style.display === 'block';
          menuUsuarioLista.style.display = abierto ? 'none' : 'block';
          btnMenuUsuario.setAttribute('aria-expanded', abierto ? 'false' : 'true');
        });
        btnMenuUsuario.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      }
      document.addEventListener('click', function(e) {
        var menuUsuario = document.getElementById('menuUsuario');
        if (menuUsuario && !menuUsuario.contains(e.target)) {
          var lista = document.getElementById('menuUsuarioLista');
          var boton = document.getElementById('btnMenuUsuario');
          if (lista) lista.style.display = 'none';
          if (boton) boton.setAttribute('aria-expanded', 'false');
        }
      });

      // Cambiar contraseña (disponible para todos los roles).
      document.getElementById('btnCambiarContrasenaGlobal').addEventListener('click', function() {
        cerrarMenuUsuario_();
        abrirModalContrasena();
      });
      document.getElementById('btnCerrarModalContrasena').addEventListener('click', cerrarModalContrasena);
      document.getElementById('formContrasenaGlobal').addEventListener('submit', cambiarMiContrasenaGlobal);
      var fondoModal = document.getElementById('modalContrasena');
      if (fondoModal) {
        fondoModal.addEventListener('click', function(e) {
          if (e.target === fondoModal) cerrarModalContrasena();
        });
      }

    }

    // Mostrar un estado de carga mientras llegan los datos en una sola llamada.
    var contenidoIni = document.getElementById('contenido');
    if (contenidoIni) contenidoIni.innerHTML = '<div class="cargando">Cargando…</div>';

    // Cargar la vista inicial una vez que estén los datos en memoria.
    cargarDatosIniciales(function() {
      avisarNuevosUsuarios();
      irAVista('Clientes');
    });
  }

  // Aplica la configuración a los elementos globales (título, banner, nav).
  function aplicarConfiguracionGlobal() {
    var c = Estado.config;
    aplicarColorPrimario(c.colorPrimario);
    aplicarColorSecundario(c.colorSecundario);
    aplicarTema(c.tema);

    // Título del negocio en la barra y en el documento.
    var titulo = document.getElementById('tituloNegocio');
    if (titulo) titulo.textContent = c.nombreNegocio || 'Gestor de Clientes';
    document.title = (c.nombreNegocio || 'Gestor de Clientes');

    // Logo del negocio (arriba a la izquierda, antes del nombre).
    var logo = document.getElementById('logoNegocio');
    if (logo) {
      if (c.logoUrl) {
        logo.src = c.logoUrl;
        logo.style.display = 'inline-block';
      } else {
        logo.removeAttribute('src');
        logo.style.display = 'none';
      }
    }

    // Favicon: duplica el logo del negocio en la pestaña del navegador.
    var favicon = document.getElementById('faviconApp');
    if (favicon && c.logoUrl) favicon.href = c.logoUrl;

    // Instalable a pantalla completa (PWA): icono de iOS, título y manifest dinámico.
    var appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon && c.logoUrl) appleIcon.href = c.logoUrl;
    var metaTitulo = document.getElementById('metaAppleTitle');
    if (metaTitulo) metaTitulo.setAttribute('content', c.nombreNegocio || 'Gestor de Clientes y Citas');
    var metaColor = document.getElementById('metaThemeColor');
    if (metaColor) metaColor.setAttribute('content', c.colorPrimario || '#4285F4');
    actualizarManifestPWA(c);

    // Mensaje de bienvenida (máximo 5 veces por usuario; se oculta al cambiar de vista).
    var banner = document.getElementById('bannerBienvenida');
    var msg = document.getElementById('mensajeBienvenida');
    if (banner && msg && c.mensajeBienvenida && !Estado.bienvenidaMostrada) {
      if (debeMostrarBienvenida()) {
        msg.textContent = c.mensajeBienvenida;
        banner.style.display = 'block';
        Estado.bienvenidaMostrada = true;
      }
    }

    // Pie de página.
    var pie = document.getElementById('pieNegocio');
    if (pie) pie.textContent = (c.nombreNegocio || 'Gestor de Clientes') + ' · © ' + new Date().getFullYear();

    // Etiquetas de la barra de navegación.
    var navCitas = document.getElementById('navCitas');
    if (navCitas) navCitas.textContent = etCitas();
  }

  // Arma un manifest de PWA en memoria (nombre, colores e ícono del negocio)
  // para que "Agregar a pantalla de inicio" abra la app en pantalla completa.
  function actualizarManifestPWA(c) {
    var link = document.getElementById('manifestApp');
    if (!link) return;
    var nombre = c.nombreNegocio || 'Gestor de Clientes y Citas';
    var manifest = {
      name: nombre,
      short_name: nombre.slice(0, 20),
      start_url: location.href,
      scope: location.href,
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: c.colorPrimario || '#4285F4',
      icons: c.logoUrl ? [
        { src: c.logoUrl, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: c.logoUrl, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ] : []
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    link.href = URL.createObjectURL(blob);
  }

  // Devuelve true si el banner de bienvenida debe mostrarse (máx. 5 veces
  // por usuario). Al mostrarse, incrementa el contador en localStorage.
  function debeMostrarBienvenida() {
    var sesion = obtenerSesion();
    if (!sesion || !sesion.usuario) return false;
    var clave = 'vecesBienvenida_' + sesion.usuario;
    var veces = parseInt(localStorage.getItem(clave), 10) || 0;
    if (veces >= 5) return false;
    localStorage.setItem(clave, String(veces + 1));
    return true;
  }

  // Oculta el banner de bienvenida (p. ej. al cambiar de vista por primera vez).
  function ocultarBienvenida() {
    var banner = document.getElementById('bannerBienvenida');
    if (banner) banner.style.display = 'none';
  }

  // Reemplaza el texto de los elementos marcados con data-et dentro de un contenedor.
  function aplicarEtiquetasVista(contenedor) {
    if (!contenedor) return;
    var mapa = {
      'cita':  etCita(),
      'citas': etCitas(),
      'cita_min':  minuscInicial(etCita()),
      'citas_min': minuscInicial(etCitas()),
      'cita_nueva': (etiquetaFemenina(etCita()) ? 'nueva' : 'nuevo') + ' ' + minuscInicial(etCita()),
      'cita_una': articuloEtiqueta(etCita()) + ' ' + minuscInicial(etCita())
    };
    var nodos = contenedor.querySelectorAll('[data-et]');
    for (var i = 0; i < nodos.length; i++) {
      var clave = nodos[i].getAttribute('data-et');
      if (mapa[clave] !== undefined) {
        nodos[i].textContent = mapa[clave];
      }
    }
  }

  /* ==========================================================
     VISTA: USUARIOS (solo administrador)
     ========================================================== */

  function initUsuarios() {
    document.getElementById('formUsuario').addEventListener('submit', guardarUsuario);
    document.getElementById('btnCancelarUsuario').addEventListener('click', cancelarEdicionUsuario);
    cargarUsuarios();
  }

  function cargarUsuarios(forzar, callback) {
    var tbody = document.getElementById('tablaUsuarios');
    if (forzar) Estado.usuariosCargados = false;
    if (Estado.usuariosCargados) {
      dibujarUsuarios(tbody, Estado.usuariosLista || []);
      if (typeof callback === 'function') callback();
      return;
    }
    google.script.run
      .withSuccessHandler(function(resp) {
        if (sesionInvalida(resp)) { if (typeof callback === 'function') callback(); return; }
        if (resp && resp.exito) {
          Estado.usuariosLista = resp.usuarios || [];
          Estado.usuariosCargados = true;
          dibujarUsuarios(tbody, resp.usuarios || []);
        } else {
          tbody.innerHTML = '<tr><td colspan="5" class="vacio">' + esc((resp && resp.mensaje) || 'No se pudieron cargar los usuarios.') + '</td></tr>';
        }
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="5" class="vacio">Error al cargar usuarios.</td></tr>';
        mostrarToast(err.message, 'error');
        if (typeof callback === 'function') callback();
      })
      .listarUsuarios(tokenSesion());
  }

  function dibujarUsuarios(tbody, usuarios) {
    if (!usuarios || usuarios.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="vacio">No hay usuarios registrados.</td></tr>';
      return;
    }
    var sesion = obtenerSesion();
    var nivelSesion = sesion.principal ? 3 : (sesion.rol === 'administrador' ? 2 : 1);
    tbody.innerHTML = usuarios.map(function(u) {
      var esYo = String(u.usuario).toLowerCase() === String(sesion.usuario).toLowerCase();
      var nivelU = u.principal ? 3 : (u.rol === 'administrador' ? 2 : 1);
      var puedeEditar = esYo || (nivelSesion > nivelU);
      var puedeEliminar = !esYo && !u.principal && (nivelSesion > nivelU);
      return '<tr>' +
        '<td>' + esc(u.usuario) + (esYo ? ' <span class="etiqueta etiqueta-programada">usted</span>' : '') + (u.principal ? ' <span class="etiqueta etiqueta-programada">Propietario</span>' : '') + '</td>' +
        '<td>' + esc(u.nombre) + '</td>' +
        '<td>' + (u.rol === 'administrador' ? 'Administrador' : 'Editor') + '</td>' +
        '<td>' + (u.activo ? 'Activo' : 'Inactivo') + '</td>' +
        '<td class="acciones-fila">' +
          (puedeEditar ? '<button class="btn btn-secundario btn-pequeno" onclick="editarUsuario(\'' + esc(u.usuario) + '\')">Editar</button>' : '<span class="vacio-accion">—</span>') +
          (puedeEliminar ? '<button class="btn btn-peligro btn-pequeno" onclick="confirmarEliminarUsuario(\'' + esc(u.usuario) + '\')">Eliminar</button>' : '') +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function editarUsuario(usuario) {
    var u = null;
    (Estado.usuariosLista || []).some(function(item) {
      if (String(item.usuario).toLowerCase() === String(usuario).toLowerCase()) {
        u = item;
        return true;
      }
      return false;
    });
    if (!u) {
      mostrarToast('No se encontró el usuario indicado.', 'error');
      return;
    }
    document.getElementById('usuarioIdOriginal').value = u.usuario;
    document.getElementById('usu_usuario').value = u.usuario;
    document.getElementById('usu_usuario').disabled = true;
    document.getElementById('usu_nombre').value = u.nombre || '';
    document.getElementById('usu_contrasena').value = '';
    document.getElementById('usu_contrasena').placeholder = 'Dejar en blanco para no cambiarla';
    document.getElementById('campoUsuarioContrasena').style.display = 'none';
    document.getElementById('usu_contrasena_confirmar').value = '';
    document.getElementById('campoUsuarioContrasenaConfirmar').style.display = 'none';
    document.getElementById('usu_rol').value = u.rol === 'administrador' ? 'administrador' : 'editor';
    document.getElementById('usu_activo').value = u.activo ? 'SI' : 'NO';
    document.getElementById('tituloFormUsuario').textContent = 'Editar usuario';
    document.getElementById('btnGuardarUsuario').textContent = 'Actualizar usuario';
    document.getElementById('btnCancelarUsuario').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicionUsuario() {
    document.getElementById('formUsuario').reset();
    document.getElementById('usuarioIdOriginal').value = '';
    document.getElementById('usu_usuario').disabled = false;
    document.getElementById('usu_contrasena').placeholder = 'Mínimo 8 caracteres';
    document.getElementById('campoUsuarioContrasena').style.display = '';
    document.getElementById('usu_contrasena_confirmar').placeholder = 'Repita la contraseña';
    document.getElementById('campoUsuarioContrasenaConfirmar').style.display = '';
    document.getElementById('usu_activo').value = 'SI';
    document.getElementById('tituloFormUsuario').textContent = 'Nuevo usuario';
    document.getElementById('btnGuardarUsuario').textContent = 'Crear usuario';
    document.getElementById('btnCancelarUsuario').style.display = 'none';
  }

  function guardarUsuario(e) {
    e.preventDefault();
    var original = document.getElementById('usuarioIdOriginal').value;
    var usuario = document.getElementById('usu_usuario').value.trim();
    var datos = {
      usuario: usuario,
      nombre: document.getElementById('usu_nombre').value.trim(),
      contrasena: original ? '' : document.getElementById('usu_contrasena').value,
      rol: document.getElementById('usu_rol').value,
      activo: document.getElementById('usu_activo').value
    };
    if (!usuario) {
      mostrarToast('El usuario es obligatorio.', 'error');
      return;
    }
    if (!original && !datos.contrasena) {
      mostrarToast('La contraseña es obligatoria al crear un usuario.', 'error');
      return;
    }
    if (!original) {
      var confirmarContrasena = document.getElementById('usu_contrasena_confirmar').value;
      if (datos.contrasena !== confirmarContrasena) {
        mostrarToast('Las contraseñas no coinciden.', 'error');
        return;
      }
    }

    var btn = document.getElementById('btnGuardarUsuario');
    var manejador = function(resp) {
      btn.disabled = false;
      btn.textContent = original ? 'Actualizar usuario' : 'Crear usuario';
      ocultarCargaZona('tablaUsuarios');
      if (sesionInvalida(resp)) return;
      if (resp && resp.exito) {
        mostrarToast(resp.mensaje, 'exito');
        cancelarEdicionUsuario();
        cargarUsuarios(true);
        // Si el usuario editado es el de la sesión, refrescar nombre/avatar en la barra.
        var s = obtenerSesion();
        if (s && String(datos.usuario).toLowerCase() === String(s.usuario).toLowerCase()) {
          guardarSesion(s.usuario, datos.nombre || s.nombre, s.rol, s.token, s.principal);
          actualizarBarraSesion();
        }
      } else {
        mostrarToast((resp && resp.mensaje) || 'No se pudo guardar el usuario.', 'error');
      }
    };

    btn.disabled = true;
    btn.textContent = 'Guardando…';
    mostrarCargaZona('tablaUsuarios', original ? 'Actualizando usuario…' : 'Creando usuario…');
    if (original) {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .actualizarUsuario(tokenSesion(), datos);
    } else {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .crearUsuario(tokenSesion(), datos);
    }
  }

  function confirmarEliminarUsuario(usuario) {
    if (!confirm('¿Eliminar al usuario "' + usuario + '"? Esta acción no se puede deshacer.')) return;
    mostrarCargaZona('tablaUsuarios', 'Eliminando usuario…');
    google.script.run
      .withSuccessHandler(function(resp) {
        ocultarCargaZona('tablaUsuarios');
        if (sesionInvalida(resp)) return;
        if (resp && resp.exito) {
          mostrarToast(resp.mensaje, 'exito');
          cargarUsuarios(true);
        } else {
          mostrarToast((resp && resp.mensaje) || 'No se pudo eliminar el usuario.', 'error');
        }
      })
      .withFailureHandler(function(err) { ocultarCargaZona('tablaUsuarios'); mostrarToast('Error: ' + err.message, 'error'); })
      .eliminarUsuario(tokenSesion(), usuario);
  }

  /* ==========================================================
     CAMBIAR MI CONTRASEÑA (modal global, todos los roles)
     ========================================================== */

  function abrirModalContrasena() {
    var modal = document.getElementById('modalContrasena');
    if (modal) modal.style.display = 'flex';
    var f = document.getElementById('formContrasenaGlobal');
    if (f) f.reset();
    var actual = document.getElementById('g_contrasena_actual');
    if (actual) actual.focus();
  }

  function cerrarModalContrasena() {
    var modal = document.getElementById('modalContrasena');
    if (modal) modal.style.display = 'none';
  }

  function cambiarMiContrasenaGlobal(e) {
    e.preventDefault();
    var actual = document.getElementById('g_contrasena_actual').value;
    var nueva = document.getElementById('g_contrasena_nueva').value;
    var btn = document.getElementById('btnGuardarContrasenaGlobal');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    google.script.run
      .withSuccessHandler(function(resp) {
        btn.disabled = false;
        btn.textContent = 'Cambiar contraseña';
        if (sesionInvalida(resp)) return;
        if (resp && resp.exito) {
          mostrarToast(resp.mensaje, 'exito');
          document.getElementById('formContrasenaGlobal').reset();
          cerrarModalContrasena();
        } else {
          mostrarToast((resp && resp.mensaje) || 'No se pudo cambiar la contraseña.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Cambiar contraseña';
        mostrarToast('Error: ' + err.message, 'error');
      })
      .cambiarContrasena(tokenSesion(), actual, nueva);
  }

</script>
