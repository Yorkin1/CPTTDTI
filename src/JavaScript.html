<script>
  /* ============================================================
     Lógica del cliente — Gestor de Clientes y Citas
     Navegación, formularios, tablas, búsqueda y notificaciones.
     Todo en español.
     ============================================================ */

  // Estado en memoria para evitar consultas repetidas.
  var Estado = {
    clientes: [],
    clientesCargados: false,
    citas: [],
    citasCargados: false,
    servicios: [],
    serviciosCargados: false,
    cacheHistorial: {},
    usuariosLista: [],
    usuariosCargados: false,
    reservaUrl: '',
    vistaActual: 'Clientes',
    // Bienvenida: máxima de 5 veces por usuario y se oculta al cambiar de vista.
    bienvenidaMostrada: false,
    primeraVistaCargada: false,
    // Configuración de la plantilla (personalización del negocio).
    config: {
      configurada: false,
      nombreNegocio: 'Mi Negocio',
      mensajeBienvenida: 'Bienvenido a nuestro sistema de gestión',
      etiquetaCita: 'Cita',
      colorPrimario: '#4285F4',
      colorSecundario: '#16a34a',
      tema: 'claro',
      duracionCitaPredeterminada: '60',
      habilitarReservas: false,
      pasoReserva: 30,
      horarioAtencion: _horarioAtencionDefault(),
      citasMaxPorDia: 0,
      citasMaxPorDiaPorSemana: {}
    }
  };

  /* -------------------- Etiquetas dinámicas -------------------- */

  // Devuelve el plural simple de una etiqueta en español.
  function pluralizar(palabra) {
    palabra = String(palabra || '');
    if (!palabra) return palabra;
    var ultima = palabra.charAt(palabra.length - 1).toLowerCase();
    if (ultima === 's') return palabra;
    if ('aeiou'.indexOf(ultima) !== -1) return palabra + 's';
    return palabra + 'es';
  }

  // Accesos rápidos a las etiquetas configuradas.
  function etCita()    { return Estado.config.etiquetaCita || 'Cita'; }
  function etCitas()   { return pluralizar(etCita()); }

  // Femenina si termina en "a", "ción", "sión", "dad", "tad" o "tud".
  function etiquetaFemenina(etiqueta) {
    var e = String(etiqueta || '').trim().toLowerCase();
    if (!e) return true;
    return /(a|ción|sión|dad|tad|tud)$/.test(e);
  }

  // Artículo indeterminado ("una"/"un") para la etiqueta de cita.
  function articuloEtiqueta(etiqueta) {
    return etiquetaFemenina(etiqueta) ? 'una' : 'un';
  }

  // Convierte la primera letra a minúscula (para usar dentro de frases).
  function minuscInicial(t) {
    t = String(t || '');
    return t ? (t.charAt(0).toLowerCase() + t.slice(1)) : t;
  }

  /* -------------------- Utilidades -------------------- */

  // Escapa texto para insertarlo de forma segura en HTML.
  function esc(texto) {
    if (texto === null || texto === undefined) return '';
    return String(texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Muestra una notificación tipo toast.
  function mostrarToast(mensaje, tipo) {
    var toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.className = 'toast visible ' + (tipo || '');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function() {
      toast.className = 'toast';
    }, 3500);
  }

  // Overlay de carga acotado a la tabla de una lista: se muestra mientras se
  // escribe/borra/refresca, para que el usuario note el delay del servidor
  // sin tapar toda la página. El objetivo es un wrapper NO scrolleable
  // (.tabla-area) que envuelve al .tabla-contenedor, de modo que la capa
  // blanca cubra toda el área de la tabla aunque se desplace horizontalmente.
  function zonaDeCarga(tbodyId) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody || !tbody.closest) return null;
    var cont = tbody.closest('.tabla-contenedor');
    if (!cont) return null;
    // Si el contenedor scrolleable aún no está envuelto en el wrapper fijo,
    // lo envolvemos dinámicamente (una sola vez).
    var area = cont.parentNode;
    if (!area || area.className.indexOf('tabla-area') === -1) {
      var wrapper = document.createElement('div');
      wrapper.className = 'tabla-area';
      cont.parentNode.insertBefore(wrapper, cont);
      wrapper.appendChild(cont);
      area = wrapper;
    }
    return area;
  }

  function mostrarCargaZona(tbodyId, texto) {
    var zona = zonaDeCarga(tbodyId);
    if (!zona) return;
    ocultarCargaZona(tbodyId);
    var el = document.createElement('div');
    el.className = 'carga-zona';
    el.id = 'cargaZona-' + tbodyId;
    el.innerHTML = '<div class="carga-zona-contenido"><div class="spinner-carga"></div><p>' +
      esc(texto || 'Cargando…') + '</p></div>';
    zona.appendChild(el);
  }

  function ocultarCargaZona(tbodyId) {
    var el = document.getElementById('cargaZona-' + tbodyId);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  // Nombre completo de un cliente a partir de su ID.
  function nombreCliente(idCliente) {
    for (var i = 0; i < Estado.clientes.length; i++) {
      if (String(Estado.clientes[i].ID_Cliente) === String(idCliente)) {
        var c = Estado.clientes[i];
        return (c.Nombre + ' ' + (c.Apellido || '')).trim();
      }
    }
    return idCliente ? 'Cliente eliminado' : '—';
  }

  // Retrasa la ejecución de fn hasta que pasan "ms" sin que se vuelva a llamar.
  // Evita re-renderizar la tabla en cada tecla al escribir en un buscador.
  function debounce(fn, ms) {
    var temporizador = null;
    return function() {
      var args = arguments;
      var ctx = this;
      clearTimeout(temporizador);
      temporizador = setTimeout(function() {
        fn.apply(ctx, args);
      }, ms);
    };
  }

  // Fuerza la recarga desde el servidor de la lista indicada y avisa al usuario.
  // Muestra el overlay de carga sobre la tabla mientras la petición al
  // servidor está en vuelo.
  // Refresca TODAS las listas/tablas del sistema. Cualquier botón "↻ Refrescar"
  // dispara esta función para mantener sincronizados clientes, citas, servicios,
  // usuarios, historial y (si aplica) el monitor de actividad.
  function refrescarTodasLasListas(terminar) {
    var cargadores = [
      function(cb) { cargarClientes(cb, true); },
      function(cb) { cargarCitas(true, cb); },
      function(cb) { cargarServicios(true, cb); },
      function(cb) { cargarUsuarios(true, cb); },
      function(cb) {
        var sel = document.getElementById('sel_cliente_historial');
        cargarHistorial(sel ? (sel.value || '') : '', true, cb);
      }
    ];
    // El monitor solo existe/es visible para el dueño con el monitor habilitado.
    if (esDuenoSesion() && Estado.config && Estado.config.habilitarMonitor === true) {
      cargadores.push(function(cb) { cargarActividad(true, cb); });
    }
    var restantes = cargadores.length;
    var completado = false;
    var fin = function() {
      if (completado) return;
      restantes--;
      if (restantes <= 0) { completado = true; if (typeof terminar === 'function') terminar(); }
    };
    // Seguridad: si alguna carga falla y no invoca su callback, no dejar el
    // indicador de carga ni el aviso colgados.
    setTimeout(function() {
      if (!completado) { completado = true; if (typeof terminar === 'function') terminar(); }
    }, 4000);
    cargadores.forEach(function(loader) {
      try { loader(fin); } catch (e) { fin(); }
    });
  }

  function refrescarLista(tipo) {
    var tbodyId = tipo === 'clientes' ? 'tablaClientes' :
                  (tipo === 'citas' ? 'tablaCitas' :
                  (tipo === 'historial' ? 'tablaHistorial' :
                  (tipo === 'servicios' ? 'tablaServicios' :
                  (tipo === 'monitor' ? 'tablaActividad' : 'tablaUsuarios'))));
    var terminar = function() {
      ocultarCargaZona(tbodyId);
      mostrarToast('Listas actualizadas.', 'exito');
    };
    mostrarCargaZona(tbodyId, 'Refrescando datos…');
    // Cualquier botón de refrescar actualiza TODAS las tablas del sistema.
    refrescarTodasLasListas(terminar);
  }
/* -------------------- Validación de formato -------------------- */

  // Valida el formato general de un correo electrónico.
  function esEmailValido(email) {
    email = String(email || '').trim();
    if (!email) return true; // el correo es opcional
    var patron = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    return patron.test(email);
  }

  // Códigos de área válidos para números dominicanos (fijos y móviles).
  var CODIGOS_AREA_RD = ['809', '829', '849'];

  // Valida el formato de un número de teléfono dominicano.
  // Debe tener exactamente 10 dígitos e iniciar con un código de área
  // válido (809, 829 u 849).
  function esTelefonoValido(telefono) {
    telefono = String(telefono || '').trim();
    if (!telefono) return true; // el teléfono es opcional
    var caracteresPermitidos = /^[0-9\s\-\(\)]+$/;
    if (!caracteresPermitidos.test(telefono)) return false;

    var digitos = telefono.replace(/\D/g, '');
    if (digitos.length !== 10) return false;
    return CODIGOS_AREA_RD.indexOf(digitos.slice(0, 3)) !== -1;
  }

  // Valida que un nombre/apellido contenga solo letras, espacios, apóstrofes y guiones
  // (sin dígitos ni símbolos), permitiendo acentos y la letra "ñ".
  function esNombreValido(texto) {
    texto = String(texto || '').trim();
    if (!texto) return true; // la obligatoriedad se valida aparte
    var patron = /^[A-Za-zÀ-ÖØ-öø-ÿ'\-\s]+$/;
    return patron.test(texto);
  }

  // Formatea un teléfono mientras se escribe: XXX-XXX-XXXX
  function formatearTelefono(valor) {
    valor = String(valor || '');
    var digitos = valor.replace(/\D/g, '').slice(0, 10);
    var resultado;
    if (digitos.length > 6) {
      resultado = digitos.slice(0, 3) + '-' + digitos.slice(3, 6) + '-' + digitos.slice(6, 10);
    } else if (digitos.length > 3) {
      resultado = digitos.slice(0, 3) + '-' + digitos.slice(3);
    } else {
      resultado = digitos;
    }
    return resultado;
  }

  // Marca visualmente un campo como inválido/válido.
  function marcarCampo(idCampo, valido) {
    var el = document.getElementById(idCampo);
    if (!el) return;
    el.style.borderColor = valido ? '' : 'var(--rojo)';
    el.style.boxShadow = valido ? '' : '0 0 0 3px rgba(220, 38, 38, 0.12)';
  }
  
  /* -------------------- Navegación -------------------- */

  function irAVista(nombreVista) {
    var vistaAnterior = Estado.vistaActual;
    Estado.vistaActual = nombreVista;

    // Ocultar el banner de bienvenida apenas el usuario cambia de vista por
    // primera vez (no en la carga inicial ni al re-renderizar la misma vista).
    if (!Estado.primeraVistaCargada && vistaAnterior !== nombreVista) {
      Estado.primeraVistaCargada = true;
      ocultarBienvenida();
    }

    // Detener el refresco automático de citas al cambiar de pantalla.
    if (window._intervaloCitas) {
      clearInterval(window._intervaloCitas);
      window._intervaloCitas = null;
    }

    // Resaltar enlace activo.
    var enlaces = document.querySelectorAll('.nav-enlace');
    for (var i = 0; i < enlaces.length; i++) {
      enlaces[i].classList.toggle('activo', enlaces[i].dataset.vista === nombreVista);
    }

    // Cerrar menú móvil.
    document.getElementById('navEnlaces').classList.remove('abierto');

    var contenido = document.getElementById('contenido');
    contenido.innerHTML = '<div class="cargando">Cargando…</div>';

    // Las vistas están precargadas como plantillas locales; se inyectan
    // sin llamar al servidor, lo que hace la navegación casi instantánea.
    setTimeout(function() {
      var tpl = document.getElementById('tpl-' + nombreVista);
      if (!tpl) {
        contenido.innerHTML = '<div class="vacio">No se pudo cargar la vista.</div>';
        return;
      }
      contenido.innerHTML = tpl.innerHTML;
      aplicarEtiquetasVista(contenido);
      inicializarVista(nombreVista);
      // Forzar la sincronización con las hojas al entrar a Clientes/Citas:
      // así una reserva hecha desde la página pública aparece nada más navegar
      // a la vista, sin depender del polling ni de la visibilidad de la pestaña.
      if (nombreVista === 'Clientes' || nombreVista === 'Citas') {
        chequearCambios(true);
      }
    }, 60);
  }

  // Ejecuta la inicialización específica de cada vista.
  function inicializarVista(nombreVista) {
    if (nombreVista === 'Clientes')  return initClientes();
    if (nombreVista === 'Servicios') return initServicios();
    if (nombreVista === 'Citas')     return initCitas();
    if (nombreVista === 'Historial') return initHistorial();
    if (nombreVista === 'Configuracion') return initConfiguracion();
    if (nombreVista === 'Usuarios') return initUsuarios();
    if (nombreVista === 'Monitor') return initMonitor();
  }

  /* ==========================================================
     VISTA: CLIENTES
     ========================================================== */

  function initClientes() {
    var form = document.getElementById('formCliente');
    form.addEventListener('submit', guardarCliente);
    document.getElementById('btnCancelarCliente').addEventListener('click', cancelarEdicionCliente);
    var campoTelefono = document.getElementById('cli_telefono');
    if (campoTelefono) {
      campoTelefono.addEventListener('input', function(e) {
        var alFinal = e.target.selectionEnd === e.target.value.length;
        e.target.value = formatearTelefono(e.target.value);
        if (alFinal) {
          e.target.selectionStart = e.target.selectionEnd = e.target.value.length;
        }
      });
    }
    document.getElementById('buscarCliente').addEventListener('input', debounce(function(e) {
      renderTablaClientes(e.target.value);
    }, 250));
    var fotoArchivo = document.getElementById('cli_foto_archivo');
    if (fotoArchivo) fotoArchivo.addEventListener('change', previsualizarFotoClienteModal);
    var btnQuitar = document.getElementById('btnQuitarFoto');
    if (btnQuitar) btnQuitar.addEventListener('click', limpiarFotoCliente);
    document.getElementById('btnAbrirModalFoto').addEventListener('click', abrirModalFoto);
    document.getElementById('btnCerrarModalFoto').addEventListener('click', cerrarModalFoto);
    document.getElementById('btnCancelarModalFoto').addEventListener('click', cerrarModalFoto);
    document.getElementById('btnUsarFoto').addEventListener('click', usarFotoSeleccionada);
    cargarClientes();
  }

  // Reservas en línea: la gestión vive en la vista Servicios (visible para todos).
  function iniciarGestionReservas() {
    var chk = document.getElementById('cfg2_reservas_habilitar');
    if (!chk) return; // La tarjeta no existe: no hacer nada.

    // El editor NO puede cambiar el horario de reservas: solo ve los botones
    // para compartir el enlace. Se oculta el bloque de configuración y el guardar.
    if (!esAdminSesion()) {
      var bloque = document.getElementById('bloqueConfigReservas');
      if (bloque) bloque.style.display = 'none';
      var btnGuardar = document.getElementById('btnGuardarReservas');
      if (btnGuardar) btnGuardar.style.display = 'none';
    }

    var c = Estado.config;
    chk.checked = !!c.habilitarReservas;
    setVal('cfg2_reservas_paso', c.pasoReserva || 30);
    setVal('cfg2_reservas_citas_max_dia', c.citasMaxPorDia || 0);
    rellenarHorarioAtencion(c.horarioAtencion || _horarioAtencionDefault());
    rellenarLimitesPorDia(c.citasMaxPorDiaPorSemana || {});
    iniciarDiasCerrados();

    document.getElementById('btnGuardarReservas').addEventListener('click', guardarReservas);
    document.getElementById('btnCopiarEnlaceReservas').addEventListener('click', copiarEnlaceReservas);

    // Botón de correo con los enlaces: visible SOLO para el dueño.
    var btnCorreo = document.getElementById('btnEnviarEnlacesDueno');
    if (btnCorreo) {
      if (esDuenoSesion()) {
        btnCorreo.style.display = '';
        btnCorreo.addEventListener('click', enviarEnlacesAlDueno);
      } else {
        btnCorreo.style.display = 'none';
      }
    }

    if (Estado.reservaUrl) {
      aplicarEnlaceReservas(Estado.reservaUrl);
    } else {
      google.script.run
        .withSuccessHandler(aplicarEnlaceReservas)
        .withFailureHandler(function() {})
        .obtenerUrlReservas();
    }
  }

  function aplicarEnlaceReservas(url) {
    if (!url) return;
    Estado.reservaUrl = url;
    var enl = document.getElementById('enlaceAbrirReservas');
    if (enl) enl.href = url;
    mostrarQrReservas(url);
  }

  function mostrarQrReservas(url) {
    var img = document.getElementById('imgQrReservas');
    var txt = document.getElementById('qrReservasUrl');
    var desc = document.getElementById('enlaceDescargarQr');
    if (!img || !url) return;
    var src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    img.onerror = function() {
      img.style.display = 'none';
      if (txt) txt.textContent = 'Enlace de reservas: ' + url;
    };
    img.src = src;
    img.style.display = 'block';
    if (txt) txt.textContent = url;
    if (desc) { desc.href = src; desc.style.display = 'inline-block'; }
  }

  // Guarda los ajustes de reservas en línea desde la vista Clientes.
  function guardarReservas() {
    var datos = {
      HABILITAR_RESERVAS: document.getElementById('cfg2_reservas_habilitar').checked ? 'SI' : 'NO',
      PASO_RESERVA_MIN: document.getElementById('cfg2_reservas_paso').value || '30',
      HORARIO_ATENCION: JSON.stringify(leerHorarioAtencionFormulario()),
      CITAS_MAX_POR_DIA: document.getElementById('cfg2_reservas_citas_max_dia').value || '0',
      CITAS_MAX_POR_DIA_POR_SEMANA: JSON.stringify(leerLimitesPorDiaFormulario())
    };

    var btn = document.getElementById('btnGuardarReservas');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    google.script.run
      .withSuccessHandler(function(resp) {
        btn.disabled = false;
        btn.textContent = 'Guardar ajustes de reservas';
        if (sesionInvalida(resp)) return;
        if (resp && resp.exito) {
          mostrarToast(resp.mensaje, 'exito');
          refrescarVistaActual();
        } else {
          mostrarToast((resp && resp.mensaje) || 'No se pudieron guardar los ajustes.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Guardar ajustes de reservas';
        mostrarToast('Error: ' + err.message, 'error');
      })
      .guardarConfiguracion(tokenSesion(), datos);
  }

  // Recarga suave: re-obtiene la configuración y re-renderiza la vista actual.
  // No usa window.location.reload() porque en Apps Script deja la página en blanco.
  function refrescarVistaActual() {
    google.script.run
      .withSuccessHandler(function(estado) {
        Estado.config = estado || Estado.config;
        aplicarConfiguracionGlobal();
        irAVista(Estado.vistaActual);
      })
      .withFailureHandler(function(err) {
        mostrarToast('No se pudo actualizar: ' + err.message, 'error');
      })
      .obtenerEstadoAplicacion();
  }

  // Detiene el chequeo de cambios (se usa al salir del panel / login).
  function detenerChequeoCambios() {
    if (window._intervaloFirma) {
      clearInterval(window._intervaloFirma);
      window._intervaloFirma = null;
    }
    window._firmaCambios = null;
  }

  // Detecta cambios externos comparando la firma de las hojas de datos.
  // Con `forzar=true` refresca aunque la firma no haya cambiado (se usa al
  // navegar a Clientes/Citas para garantizar datos frescos).
  function chequearCambios(forzar) {
    // Con la pestaña oculta no se consulta el servidor (ahorra cuota y carga).
    if (document.hidden) return;
    google.script.run
      .withSuccessHandler(function(firma) {
        if (sesionInvalida(firma)) return;
        if (!firma || !firma.exito) return;
        var clave = firma.clientes + '|' + firma.citas + '|' + firma.historial;
        if (!forzar && window._firmaCambios !== null && window._firmaCambios === clave) return;
        window._firmaCambios = clave;
        // Refrescar SIEMPRE las cachés compartidas (clientes y citas), aunque la
        // vista abierta sea otra: así un cliente o una cita creados externamente
        // (p. ej. desde la página pública de reservas) aparecen al cambiar de
        // vista, sin necesidad de recargar la página. Cada carga re-renderiza
        // solo la vista que esté visible actualmente. El primer chequeo también
        // sincroniza: la línea base que se captura pudo ya incluir cambios hechos
        // entre la carga inicial del panel y este momento.
        cargarClientes(null, true);
        cargarCitas(true);
        if (Estado.vistaActual === 'Historial') {
          var sel = document.getElementById('sel_cliente_historial');
          if (sel) cargarHistorial(sel.value || '', true);
        }
      })
      .withFailureHandler(function() {})
      .obtenerFirmaCambios(tokenSesion());
  }

  function abrirModalFoto() {
    var modal = document.getElementById('modalFotoCliente');
    if (!modal) return;
    var previaPrincipal = document.getElementById('cli_foto_preview');
    var previaModal = document.getElementById('cli_foto_preview_modal');
    if (previaModal) {
      if (previaPrincipal && previaPrincipal.style.display !== 'none' && previaPrincipal.src) {
        previaModal.src = previaPrincipal.src;
        previaModal.style.display = 'block';
      } else {
        previaModal.src = '';
        previaModal.style.display = 'none';
      }
    }
    modal.style.display = 'flex';
  }

  function cerrarModalFoto() {
    var modal = document.getElementById('modalFotoCliente');
    if (modal) modal.style.display = 'none';
  }

  function previsualizarFotoClienteModal() {
    var archivo = document.getElementById('cli_foto_archivo').files[0];
    if (!archivo) return;
    document.getElementById('cli_foto_url').value = '';
    var lector = new FileReader();
    lector.onload = function() {
      var img = document.getElementById('cli_foto_preview_modal');
      img.src = lector.result;
      img.style.display = 'block';
    };
    lector.readAsDataURL(archivo);
  }

  function usarFotoSeleccionada() {
    var previaModal = document.getElementById('cli_foto_preview_modal');
    var previaPrincipal = document.getElementById('cli_foto_preview');
    if (previaModal && previaModal.style.display !== 'none' && previaModal.src) {
      previaPrincipal.src = previaModal.src;
      previaPrincipal.style.display = 'block';
      document.getElementById('btnQuitarFoto').style.display = 'inline-block';
    }
    cerrarModalFoto();
  }

  function limpiarFotoCliente() {
    document.getElementById('cli_foto_archivo').value = '';
    document.getElementById('cli_foto_url').value = '';
    var img = document.getElementById('cli_foto_preview');
    img.src = '';
    img.style.display = 'none';
    var imgModal = document.getElementById('cli_foto_preview_modal');
    if (imgModal) { imgModal.src = ''; imgModal.style.display = 'none'; }
    document.getElementById('btnQuitarFoto').style.display = 'none';
  }

  function cargarClientes(callback, forzar) {
    // Si ya se cargaron antes y no se pidió refresco, usar la copia local
    // para que la navegación y los selectores sean instantáneos.
    if (Estado.clientesCargados && !forzar) {
      if (document.getElementById('tablaClientes')) {
        renderTablaClientes(document.getElementById('buscarCliente').value);
      }
      if (typeof callback === 'function') callback();
      return;
    }
    google.script.run
      .withSuccessHandler(function(clientes) {
        if (sesionInvalida(clientes)) { if (typeof callback === 'function') callback(); return; }
        Estado.clientes = clientes || [];
        Estado.clientesCargados = true;
        if (document.getElementById('tablaClientes')) {
          renderTablaClientes(document.getElementById('buscarCliente').value);
        }
        // Si la vista activa es Citas, re-renderizar la tabla para que la
        // columna "Cliente" muestre los nombres ya cargados (evita los "—").
        if (Estado.vistaActual === 'Citas' && document.getElementById('tablaCitas')) {
          aplicarFiltrosCitas();
        }
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        mostrarToast('Error al obtener clientes: ' + err.message, 'error');
        if (typeof callback === 'function') callback();
      })
      .obtenerClientes(tokenSesion());
  }

  function renderTablaClientes(filtro) {
    var tbody = document.getElementById('tablaClientes');
    if (!tbody) return;
    var esAdmin = esAdminSesion();
    filtro = (filtro || '').toLowerCase();

    var lista = Estado.clientes.filter(function(c) {
      if (!filtro) return true;
      var texto = (c.Nombre + ' ' + c.Apellido + ' ' + c.Telefono + ' ' + c.Email).toLowerCase();
      return texto.indexOf(filtro) !== -1;
    });

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="vacio">No hay clientes registrados.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(function(c) {
      return '<tr>' +
        '<td>' + (c.Foto ? '<img class="foto-mini" src="' + esc(c.Foto) + '" alt="Foto">' : '<span class="vacio-accion">&mdash;</span>') + '</td>' +
        '<td>' + esc((c.Nombre + ' ' + (c.Apellido || '')).trim()) + '</td>' +
        '<td>' + esc(c.Telefono) + '</td>' +
        '<td>' + esc(c.Email) + '</td>' +
        '<td class="col-wrap">' + esc(c.Direccion) + '</td>' +
        '<td>' + esc(fechaDMY(c.Fecha_Registro)) + '</td>' +
        '<td class="acciones-fila">' +
          '<button class="btn btn-secundario btn-pequeno" onclick="editarCliente(\'' + esc(c.ID_Cliente) + '\')">Editar</button>' +
          (esAdmin ? '<button class="btn btn-peligro btn-pequeno" onclick="confirmarEliminarCliente(\'' + esc(c.ID_Cliente) + '\')">Eliminar</button>' : '') +
        '</td>' +
      '</tr>';
    }).join('');

  function guardarCliente(e) {
    e.preventDefault();
    var id = document.getElementById('clienteId').value;
    var datos = {
      nombre: document.getElementById('cli_nombre').value.trim(),
      apellido: document.getElementById('cli_apellido').value.trim(),
      telefono: document.getElementById('cli_telefono').value.trim(),
      email: document.getElementById('cli_email').value.trim(),
      direccion: document.getElementById('cli_direccion').value.trim(),
      notas: document.getElementById('cli_notas').value.trim(),
      foto: document.getElementById('cli_foto_url').value.trim()
    };

    if (!datos.nombre) {
      mostrarToast('El nombre es obligatorio.', 'error');
      return;
    }

    var nombreValido = esNombreValido(datos.nombre);
    var apellidoValido = esNombreValido(datos.apellido);
    marcarCampo('cli_nombre', nombreValido);
    marcarCampo('cli_apellido', apellidoValido);
    if (!nombreValido || !apellidoValido) {
      mostrarToast('El nombre y el apellido solo deben contener letras y espacios.', 'error');
      return;
    }

    var telefonoValido = esTelefonoValido(datos.telefono);
    marcarCampo('cli_telefono', telefonoValido);
    if (!telefonoValido) {
      mostrarToast('El formato del teléfono no es válido. Use un número dominicano (809/829/849) de 10 dígitos.', 'error');
      return;
    }

    var emailValido = esEmailValido(datos.email);
    marcarCampo('cli_email', emailValido);
    if (!emailValido) {
      mostrarToast('El formato del correo electrónico no es válido.', 'error');
      return;
    }

    var btn = document.getElementById('btnGuardarCliente');
    var manejador = function(respuesta) {
      btn.disabled = false;
      btn.textContent = id ? 'Actualizar cliente' : 'Guardar cliente';
      ocultarCargaZona('tablaClientes');
      if (sesionInvalida(respuesta)) return;
      if (respuesta.exito) {
        mostrarToast(respuesta.mensaje, 'exito');
        document.getElementById('formCliente').reset();
        var imgPrev = document.getElementById('cli_foto_preview');
        if (imgPrev) { imgPrev.src = ''; imgPrev.style.display = 'none'; }
        var imgPrevModal = document.getElementById('cli_foto_preview_modal');
        if (imgPrevModal) { imgPrevModal.src = ''; imgPrevModal.style.display = 'none'; }
        var btnQuitar = document.getElementById('btnQuitarFoto');
        if (btnQuitar) btnQuitar.style.display = 'none';
        cancelarEdicionCliente();
        var fotoFinal = respuesta.foto || datos.foto || '';
        if (id) {
          actualizarClienteLocal(id, datos, fotoFinal);
        } else if (respuesta.id) {
          Estado.clientes.push({
            ID_Cliente: respuesta.id,
            Nombre: datos.nombre, Apellido: datos.apellido || '',
            Telefono: datos.telefono || '', Email: datos.email || '',
            Direccion: datos.direccion || '', Notas: datos.notas || '',
            Foto: fotoFinal, Fecha_Registro: respuesta.fechaRegistro || ''
          });
        }
        if (document.getElementById('tablaClientes')) {
          renderTablaClientes(document.getElementById('buscarCliente').value);
        }
      } else {
        mostrarToast(respuesta.mensaje, 'error');
      }
    };

    var archivo = document.getElementById('cli_foto_archivo').files[0];
    if (archivo) {
      // Subir la imagen y guardar el cliente en UNA sola llamada al servidor.
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      var lector = new FileReader();
      lector.onload = function() {
        datos.fotoDataUrl = lector.result;
        guardarClienteEnServidor(id, datos, btn, manejador);
      };
      lector.onerror = function() {
        btn.disabled = false;
        btn.textContent = 'Guardar cliente';
        mostrarToast('No se pudo leer la imagen.', 'error');
      };
      lector.readAsDataURL(archivo);
    } else {
      guardarClienteEnServidor(id, datos, btn, manejador);
    }
  }

  function guardarClienteEnServidor(id, datos, btn, manejador) {
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    mostrarCargaZona('tablaClientes', id ? 'Actualizando cliente…' : 'Guardando cliente…');
    if (id) {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .actualizarCliente(tokenSesion(), id, datos);
    } else {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .agregarCliente(tokenSesion(), datos);
    }
  }

  // Refleja la edición en la caché local sin volver a consultar el servidor.

      document.getElementById('ser_duracion').addEventListener('keydown', function(e) { if (e.key === 'ArrowUp') { e.preventDefault(); ajustarDuracion(5); } else if (e.key === 'ArrowDown') { e.preventDefault(); ajustarDuracion(-5); } });
      document.getElementById('btnDuracionSubir').addEventListener('click', function() { ajustarDuracion(5); });
      document.getElementById('btnDuracionBajar').addEventListener('click', function() { ajustarDuracion(-5); });

function duracionLegible(mins) { mins = parseInt(mins, 10) || 0; var h = Math.floor(mins / 60); var m = mins % 60; if (h && m) return h + 'h ' + m + 'min'; if (h) return h + 'h'; return m + 'min'; }
function parsearDuracion(texto) { texto = String(texto || '').toLowerCase().trim(); var mh = texto.match(/(\d+)\s*h/); var mm = texto.match(/(\d+)\s*m/); var horas = mh ? parseInt(mh[1], 10) : 0; var mins = mm ? parseInt(mm[1], 10) : 0; if (!mh && !mm) { var soloNum = texto.match(/(\d+)/); if (soloNum) mins = parseInt(soloNum[1], 10); } var total = horas * 60 + mins; return total > 0 ? total : 60; }
function formatearCampoDuracion() { var campo = document.getElementById('ser_duracion'); if (campo) campo.value = duracionLegible(parsearDuracion(campo.value)); }
function ajustarDuracion(delta) { var campo = document.getElementById('ser_duracion'); if (!campo) return; var mins = parsearDuracion(campo.value) + delta; if (mins < 5) mins = 5; campo.value = duracionLegible(mins); }
  
  // Formatea un número como dinero ("$ 1,234.50").
  function formatoMoneda(n) {
    n = parseFloat(n) || 0;
    return '$ ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function cargarServicios(forzar, callback) {
    var tbody = document.getElementById('tablaServicios');
    if (forzar) Estado.serviciosCargados = false;
    if (Estado.serviciosCargados) {
      if (tbody) renderTablaServicios();
      if (typeof callback === 'function') callback();
      return;
    }
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="cargando">Cargando…</td></tr>';
    google.script.run
      .withSuccessHandler(function(servicios) {
        if (sesionInvalida(servicios)) { if (typeof callback === 'function') callback(); return; }
        if (servicios && servicios.exito === false) {
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="vacio">' + esc(servicios.mensaje || 'No se pudieron cargar los servicios.') + '</td></tr>';
          if (typeof callback === 'function') callback();
          return;
        }
        Estado.servicios = servicios || [];
        Estado.serviciosCargados = true;
        if (tbody) renderTablaServicios();
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="vacio">Error al cargar servicios.</td></tr>';
        mostrarToast(err.message, 'error');
        if (typeof callback === 'function') callback();
      })
      .obtenerServicios(tokenSesion());
  }

  function renderTablaServicios() {
    var tbody = document.getElementById('tablaServicios');
    if (!tbody) return;
    var esAdmin = esAdminSesion();
    var lista = Estado.servicios || [];
    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + (esAdmin ? 6 : 5) + '" class="vacio">No hay servicios registrados.</td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(function(s) {
      var estado = String(s.Activo || 'SI').toUpperCase() === 'NO' ? 'Inactivo' : 'Activo';
      var claseEt = estado === 'Activo' ? 'etiqueta-programada' : 'etiqueta-expirada';
      var acciones = esAdmin
        ? '<button class="btn btn-secundario btn-pequeno" onclick="editarServicio(\'' + esc(s.ID_Servicio) + '\')">Editar</button>' +
          '<button class="btn btn-peligro btn-pequeno" onclick="confirmarEliminarServicio(\'' + esc(s.ID_Servicio) + '\')">Eliminar</button>'
        : '<span class="vacio-accion">—</span>';
      return '<tr>' +
        '<td>' + esc(s.Nombre) + '</td>' +
        '<td>' + formatoMoneda(s.Precio) + '</td>' +
        '<td>' + esc(s.Duracion_Mins) + ' min</td>' +
        '<td class="col-wrap">' + esc(s.Descripcion) + '</td>' +
        '<td><span class="etiqueta ' + claseEt + '">' + esc(estado) + '</span></td>' +
        '<td class="acciones-fila">' + acciones + '</td>' +
      '</tr>';
    }).join('');
  }

        .agregarServicio(tokenSesion(), datos);

  function initCitas() {
    document.getElementById('formCita').addEventListener('submit', guardarCita);
    document.getElementById('btnCancelarCita').addEventListener('click', cancelarEdicionCita);
    // Lista de servicios plegable: arranca colapsada.
    var btnTglSvc = document.getElementById('btnToggleServiciosCita');
    if (btnTglSvc) btnTglSvc.addEventListener('click', alternarServiciosCita);
    var contSvcInit = document.getElementById('cita_servicios');
    if (contSvcInit) contSvcInit.classList.add('colapsado');
    var inputDur = document.getElementById('cita_duracion');
    if (inputDur) inputDur.value = Estado.config.duracionCitaPredeterminada || 60;
    document.getElementById('buscarCita').addEventListener('input', debounce(aplicarFiltrosCitas, 250));
    document.getElementById('filtroEstadoCita').addEventListener('change', aplicarFiltrosCitas);
    // Se cargan los clientes primero y, al terminar, se llenan el selector y se
    // cargan las citas. Así la columna "Cliente" siempre tiene los nombres al
    // dibujarse (evita mostrar "—" por cargar citas antes que clientes).
    cargarClientes(function() {
      llenarSelectClientes('cita_cliente');
      cargarCitas();
    });
    // Cargar el catálogo de servicios para que el usuario elija al agendar.
    cargarServicios(true, renderServiciosCita);

    // Re-rendiza las citas de forma automática: así una cita que había estado
    // "Programada" pasa a "Expirada" nada más cumplirse su hora de fin, sin
    // tener que recargar o cambiar de pantalla.
    if (window._intervaloCitas) clearInterval(window._intervaloCitas);
    window._intervaloCitas = setInterval(function() {
      if (document.hidden) return; // No re-renderizar con la pestaña oculta.
      var firma = firmaCitasVigentes();
      if (firma !== window._firmaCitas) aplicarFiltrosCitas();
    }, 30000);
  }

  // Dibuja el selector de servicios en el formulario de citas. La duración se
  // calcula a partir de los servicios marcados (no la elige el usuario).
  function renderServiciosCita() {
    var cont = document.getElementById('cita_servicios');
    if (!cont) return;
    var lista = Estado.servicios || [];
    var activos = lista.filter(function(s) {
      return String(s.Activo || 'SI').toUpperCase() !== 'NO';
    });
    if (activos.length === 0) {
      cont.innerHTML = '<p class="vacio-accion">No hay servicios activos.</p>';
      calcularDuracionCita();
      return;
    }
    cont.innerHTML = activos.map(function(s) {
      return '<div class="fila-servicio-cita">' +
        '<label class="servicio-chk"><input type="checkbox" class="serv-cita" value="' + esc(s.ID_Servicio) +
        '" data-dur="' + esc(s.Duracion_Mins) + '"> ' + esc(s.Nombre) + ' (' + formatoMoneda(s.Precio) +
        ' · ' + esc(s.Duracion_Mins) + ' min)</label>' +
        '<input type="number" class="serv-cant-cita" min="1" step="1" value="1" style="width:64px;">' +
        '</div>';
    }).join('');
    var checks = cont.querySelectorAll('.serv-cita');
    for (var i = 0; i < checks.length; i++) {
      checks[i].addEventListener('change', calcularDuracionCita);
    }
    var cants = cont.querySelectorAll('.serv-cant-cita');
    for (var j = 0; j < cants.length; j++) {
      cants[j].addEventListener('input', calcularDuracionCita);
    }
    calcularDuracionCita();
    actualizarBotonServiciosCita();
  }

  // Muestra/oculta la lista de servicios del formulario de citas.
  function alternarServiciosCita() {
    var cont = document.getElementById('cita_servicios');
    if (!cont) return;
    cont.classList.toggle('colapsado');
    actualizarBotonServiciosCita();
  }

  // Actualiza el texto del botón plegable: total si está cerrado,
  // seleccionados si hay, u "Ocultar" si está abierto.
  function actualizarBotonServiciosCita() {
    var btn = document.getElementById('btnToggleServiciosCita');
    if (!btn) return;
    var cont = document.getElementById('cita_servicios');
    var colapsado = !cont || cont.classList.contains('colapsado');
    var total = 0;
    var sel = 0;
    if (cont) {
      var checks = cont.querySelectorAll('.serv-cita');
      total = checks.length;
      for (var i = 0; i < checks.length; i++) {
        if (checks[i].checked) sel++;
      }
    }
    if (!colapsado) {
      btn.textContent = 'Ocultar servicios';
    } else if (sel > 0) {
      btn.textContent = 'Servicios (' + sel + ' seleccionados)';
    } else if (total > 0) {
      btn.textContent = 'Mostrar servicios (' + total + ')';
    } else {
      btn.textContent = 'Mostrar servicios';
    }
  }

  // Suma las duraciones de los servicios marcados y actualiza el campo oculto
  // de duración y el texto visible.
  function calcularDuracionCita() {
    var cont = document.getElementById('cita_servicios');
    var dur = 0;
    if (cont) {
      var checks = cont.querySelectorAll('.serv-cita');
      for (var i = 0; i < checks.length; i++) {
        if (checks[i].checked) {
          var mins = parseInt(checks[i].getAttribute('data-dur'), 10) || 0;
          var cantInput = checks[i].parentNode.parentNode.querySelector('.serv-cant-cita');
          var cant = parseInt(cantInput ? cantInput.value : '1', 10) || 1;
          if (cant < 1) cant = 1;
          dur += mins * cant;
        }
      }
    }
    var input = document.getElementById('cita_duracion');
    var base = (Estado.config && Estado.config.duracionCitaPredeterminada) || 60;
    if (input) input.value = dur > 0 ? dur : base;
    var mostrar = document.getElementById('cita_duracion_mostrar');
    if (mostrar) mostrar.textContent = 'Duración: ' + (input ? input.value : base) + ' min';
    actualizarBotonServiciosCita();
  }

  // Devuelve los servicios seleccionados como [{ id, cantidad }].
  function obtenerServiciosCita() {
    var cont = document.getElementById('cita_servicios');
    var arr = [];
    if (cont) {
      var checks = cont.querySelectorAll('.serv-cita');
      for (var i = 0; i < checks.length; i++) {
        if (checks[i].checked) {
          var cantInput = checks[i].parentNode.parentNode.querySelector('.serv-cant-cita');
          var cant = parseInt(cantInput ? cantInput.value : '1', 10) || 1;
          if (cant < 1) cant = 1;
          arr.push({ id: checks[i].value, cantidad: cant });
        }
      }
    }
    return arr;
  }

  // Pre-marca los servicios al editar una cita existente (desde su JSON).
  function marcarServiciosCita(jsonServicios) {
    var cont = document.getElementById('cita_servicios');
    if (!cont) return;
    var sel = {};
    try {
      var arr = JSON.parse(jsonServicios || '[]');
      arr.forEach(function(it) { sel[String(it.id)] = it.cantidad || 1; });
    } catch (e) {}
    var checks = cont.querySelectorAll('.serv-cita');
    for (var i = 0; i < checks.length; i++) {
      var id = checks[i].value;
      if (sel[id]) {
        checks[i].checked = true;
        var cantInput = checks[i].parentNode.parentNode.querySelector('.serv-cant-cita');
        if (cantInput) cantInput.value = sel[id];
      } else {
        checks[i].checked = false;
      }
    }
    // Al editar, expandir la lista solo si quedó algo marcado.
    var marcados = 0;
    for (var m = 0; m < checks.length; m++) {
      if (checks[m].checked) marcados++;
    }
    if (marcados > 0) cont.classList.remove('colapsado');
    calcularDuracionCita();
    actualizarBotonServiciosCita();
  }

  // Aplica el buscador y el filtro por estado sobre las citas cargadas.
  function aplicarFiltrosCitas() {
    var tbody = document.getElementById('tablaCitas');
    if (!tbody) return;
    var term = (document.getElementById('buscarCita').value || '').toLowerCase();
    var est = document.getElementById('filtroEstadoCita').value;
    var lista = (Estado.citas || []).filter(function(c) {
      if (est && estadoVigenteCita(c).estado !== est) return false;
      if (term) {
        var texto = (c.Titulo + ' ' + nombreCliente(c.ID_Cliente)).toLowerCase();
        if (texto.indexOf(term) === -1) return false;
      }
      return true;
    });
    dibujarCitas(tbody, lista);
  }

  // Estado "vigente" de una cita: si está Programada y su hora de fin ya pasó,
  // se muestra como Expirada (aún así se puede marcar como completada manualmente).
  function estadoVigenteCita(c) {
    var est = String(c.Estado || 'Programada');
    if (est === 'Completada') {
      return { estado: 'Completada', completada: true, expirada: false, bloqueada: false };
    }
    if (est === 'Expirada') {
      return { estado: 'Expirada', completada: false, expirada: true, bloqueada: false };
    }
    var fin = finCitaDate(c.Fecha, c.Hora, c.Duracion_Mins);
    var vencida = fin ? (fin.getTime() < Date.now()) : false;
    if (vencida) {
      return { estado: 'Expirada', completada: false, expirada: true, bloqueada: false };
    }
    return { estado: 'Programada', completada: false, expirada: false, bloqueada: false };
  }

  // Fecha (timestamp) en que termina la cita: fecha + hora + duración.
  function finCitaDate(fecha, hora, durMin) {
    var f = fechaLegible(fecha);
    var h = horaLegible(hora);
    if (!f || !h) return null;
    var pf = f.split('-');
    var ph = h.split(':');
    if (pf.length !== 3 || ph.length !== 2) return null;
    var d = new Date(
      parseInt(pf[0], 10),
      parseInt(pf[1], 10) - 1,
      parseInt(pf[2], 10),
      parseInt(ph[0], 10),
      parseInt(ph[1], 10), 0);
    var mins = parseInt(durMin, 10) || 0;
    return new Date(d.getTime() + mins * 60000);
  }

  // Firma que cambia cuando cambia el estado vigente (p. ej. una cita expira).
  function firmaCitasVigentes() {
    return (Estado.citas || []).map(function(c) {
      return c.ID_Cita + ':' + String(c.Estado) + ':' + estadoVigenteCita(c).estado;
    }).join('|');
  }

  function cargarCitas(forzar, callback) {
    var tbody = document.getElementById('tablaCitas');
    if (forzar) Estado.citasCargados = false;
    if (Estado.citasCargados) {
      aplicarFiltrosCitas();
      if (typeof callback === 'function') callback();
      return;
    }
    google.script.run
      .withSuccessHandler(function(citas) {
        if (sesionInvalida(citas)) { if (typeof callback === 'function') callback(); return; }
        Estado.citas = citas || [];
        Estado.citasCargados = true;
        aplicarFiltrosCitas();
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="11" class="vacio">Error al cargar citas.</td></tr>';
        mostrarToast(err.message, 'error');
        if (typeof callback === 'function') callback();
      })
      .obtenerCitas(tokenSesion());
  }

  // Devuelve solo la parte de fecha (quita " 00:00") de un valor leído.
  function fechaLegible(f) {
    f = String(f || '');
    var m = f.match(/^(\d{4}-\d{2}-\d{2})(?: 00:00)?$/);
    return m ? m[1] : f;
  }

  // Devuelve solo la hora (HH:mm) si un valor trae fecha base (1899-12-30).
  function horaLegible(h) {
    h = String(h || '');
    var m = h.match(/\d{2}:\d{2}$/);
    return m ? m[0] : h;
  }

  // Convierte "HH:mm" a minutos desde las 00:00 (0 si no es válido).
  function horaAMin(h) {
    var m = String(h || '').match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return 0;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  // Comprueba (solo en el cliente) si una cita [hora, hora+duración) de una
  // fecha choca con otra ya registrada. "exceptoId" ignora la cita en edición.
  function citaChocaLocal(fecha, hora, duracion, exceptoId) {
    var inicio = horaAMin(hora);
    var fin = inicio + (parseInt(duracion, 10) || 60);
    var citas = Estado.citas || [];
    for (var i = 0; i < citas.length; i++) {
      var c = citas[i];
      if (exceptoId && String(c.ID_Cita) === String(exceptoId)) continue;
      var est = String(c.Estado || '');
      if (est === 'Completada' || est === 'Cancelada') continue;
      if (fechaLegible(c.Fecha) !== String(fecha)) continue;
      var cIni = horaAMin(horaLegible(c.Hora));
      var cFin = cIni + (parseInt(c.Duracion_Mins, 10) || 60);
      if (inicio < cFin && fin > cIni) return true;
    }
    return false;
  }

  // Devuelve la hora en formato de 12 horas (h:mm AM/PM).
  function hora12(h) {
    h = horaLegible(h);
    var m = h.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return h;
    var hh = parseInt(m[1], 10);
    var mm = m[2];
    var suf = hh >= 12 ? 'PM' : 'AM';
    var h12 = hh % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + mm + ' ' + suf;
  }

  // Convierte una fecha "yyyy-MM-dd" (con o sin hora al final) a "dd-MM-yyyy",
// mostrando la parte de hora (si viene) en formato de 12 horas (h:mm AM/PM).
  function fechaDMY(f) {
    f = String(f || '');
    var m = f.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    if (!m) return f;
    var resto = m[4] || '';
    var tm = resto.match(/(\d{1,2}):(\d{2})$/);
    if (tm) {
      resto = resto.replace(tm[0], hora12(tm[0]));
    }
    return m[3] + '-' + m[2] + '-' + m[1] + resto;
  }

  function dibujarCitas(tbody, citas) {
    var esAdmin = esAdminSesion();
    if (!citas || citas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="vacio">No hay ' +
        minuscInicial(etCitas()) + ' registradas.</td></tr>';
      return;
    }
    // Ordenar por fecha y hora.
    citas.sort(function(a, b) {
      return (fechaLegible(a.Fecha) + horaLegible(a.Hora)).localeCompare(
        fechaLegible(b.Fecha) + horaLegible(b.Hora));
    });
    window._citasActuales = citas;
    window._firmaCitas = firmaCitasVigentes();
    tbody.innerHTML = citas.map(function(c) {
      var info = estadoVigenteCita(c);
      var estado = info.estado;
      var claseEt = estado === 'Completada' ? 'etiqueta-completada' :
                    (estado === 'Expirada' ? 'etiqueta-expirada' : 'etiqueta-programada');
      var filaClase = estado === 'Completada' ? ' class="fila-completada"' :
                      (estado === 'Expirada' ? ' class="fila-expirada"' : '');
      var chk = '<input type="checkbox" class="check-completar" title="Marcar como completada" ' +
        (info.completada ? 'checked ' : '') +
        (info.completada || info.bloqueada ? 'disabled ' : '') +
        'onchange="cambiarEstadoCita(\'' + esc(c.ID_Cita) + '\', this.checked ? \'Completada\' : \'Programada\')">';
      return '<tr' + filaClase + '>' +
        '<td class="col-check">' + chk + '</td>' +
        '<td>' + esc(c.Titulo) + '</td>' +
        (function() {
          var nomCli = nombreCliente(c.ID_Cliente);
          return '<td class="col-cliente" title="' + esc(nomCli) + '">' + esc(nomCli) + '</td>';
        })() +
        '<td>' + esc(c.Agendado_Por || (c.Descripcion && c.Descripcion.indexOf('Reservada') === 0 ? 'Cliente (en línea)' : '')) + '</td>' +
        '<td>' + esc(fechaDMY(fechaLegible(c.Fecha))) + '</td>' +
        '<td>' + esc(hora12(c.Hora)) + '</td>' +
        '<td>' + esc(c.Duracion_Mins) + ' min</td>' +
        '<td>' + (c.Total_Precio ? formatoMoneda(c.Total_Precio) : '<span class="vacio-accion">&mdash;</span>') + '</td>' +
        (function() {
          var srvTxt = '';
          var srvTitle = '';
          try {
            var srv = JSON.parse(c.Servicios || '[]') || [];
            if (srv.length) {
              srvTxt = srv.map(function(s) {
                return esc(s.nombre || 'Servicio') + (s.cantidad > 1 ? ' ×' + s.cantidad : '');
              }).join(', ');
              srvTitle = srv.map(function(s) {
                return (s.nombre || 'Servicio') + (s.cantidad > 1 ? ' ×' + s.cantidad : '');
              }).join(', ');
            }
          } catch (e) {}
          if (!srvTxt) { srvTxt = '<span class="vacio-accion">&mdash;</span>'; srvTitle = 'Sin servicios'; }
          return '<td class="col-servicios" title="' + esc(srvTitle) + '">' + srvTxt + '</td>';
        })() +
        '<td class="col-estado"><span class="etiqueta ' + claseEt + '">' + esc(estado) + '</span></td>' +
        '<td class="acciones-fila">' +
          '<button class="btn btn-secundario btn-pequeno" onclick="editarCita(\'' + esc(c.ID_Cita) + '\')">Editar</button>' +
          (esAdmin ? '<button class="btn btn-peligro btn-pequeno" onclick="confirmarEliminarCita(\'' + esc(c.ID_Cita) + '\')">Eliminar</button>' : '') +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function guardarCita(e) {
    e.preventDefault();
    var id = document.getElementById('citaId').value;
    var datos = {
      idCliente: document.getElementById('cita_cliente').value,
      titulo: document.getElementById('cita_titulo').value.trim(),
      fecha: document.getElementById('cita_fecha').value,
      hora: document.getElementById('cita_hora').value,
      duracionMins: document.getElementById('cita_duracion').value,
      descripcion: document.getElementById('cita_descripcion').value.trim(),
      servicios: obtenerServiciosCita()
    };
    // Enviar correo/nombre del cliente para que el servidor no tenga que releer
    // toda la hoja Clientes al enviar la confirmación (rendimiento).
    for (var i = 0; i < Estado.clientes.length; i++) {
      if (String(Estado.clientes[i].ID_Cliente) === String(datos.idCliente)) {
        var c = Estado.clientes[i];
        datos.emailCliente = c.Email || '';
        datos.nombreCliente = (c.Nombre + ' ' + (c.Apellido || '')).trim();
        break;
      }
    }
    if (!datos.idCliente || !datos.titulo || !datos.fecha || !datos.hora) {
      mostrarToast('Complete los campos obligatorios.', 'error');
      return;
    }

    // Aviso rápido de superposición con otra cita del mismo día.
    if (citaChocaLocal(datos.fecha, datos.hora, datos.duracionMins, id || '')) {
      mostrarToast('Ya existe ' + articuloEtiqueta(etCita()) + ' ' + minuscInicial(etCita()) + ' en ese horario. Elija otra hora.', 'error');
      return;
    }

    // Aviso no bloqueante: si el negocio ofrece servicios pero la cita no tiene ninguno.
    if ((Estado.servicios || []).length > 0 && (obtenerServiciosCita() || []).length === 0) {
      mostrarToast('Aviso: ' + articuloEtiqueta(etCita()) + ' ' + minuscInicial(etCita()) + ' no tiene servicios.', 'aviso');
    }

    var btn = document.getElementById('btnGuardarCita');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    mostrarCargaZona('tablaCitas', id ? 'Actualizando ' + minuscInicial(etCita()) + '…' : 'Agendando ' + minuscInicial(etCita()) + '…');

    var manejador = function(respuesta) {
      btn.disabled = false;
      btn.textContent = id ? 'Actualizar cita' : 'Agendar cita';
      ocultarCargaZona('tablaCitas');
      if (sesionInvalida(respuesta)) return;
      if (respuesta.exito) {
        mostrarToast(respuesta.mensaje, 'exito');
        if (respuesta.advertenciaLimite) {
          mostrarToast(respuesta.advertenciaLimite, 'aviso');
        }
        cancelarEdicionCita();
        if (id) {
          actualizarCitaLocal(id, datos);
        } else if (respuesta.id) {
          var srvLocal = (datos.servicios || []).map(function(s) {
            var def = (Estado.servicios || []).filter(function(x) {
              return String(x.ID_Servicio) === String(s.id);
            })[0];
            var precio = def ? (parseFloat(def.Precio) || 0) : 0;
            var cant = s.cantidad || 1;
            return {
              id: s.id, nombre: def ? def.Nombre : 'Servicio',
              precio: precio, cantidad: cant, subtotal: precio * cant,
              duracionMins: def ? def.Duracion_Mins : 0
            };
          });
          var totalLocal = srvLocal.reduce(function(a, s) { return a + (s.subtotal || 0); }, 0);
          Estado.citas.push({
            ID_Cita: respuesta.id,
            ID_Cliente: datos.idCliente || '',
            Titulo: datos.titulo || '',
            Fecha: String(datos.fecha || ''),
            Hora: String(datos.hora || ''),
            Duracion_Mins: parseInt(datos.duracionMins, 10) || 60,
            Descripcion: datos.descripcion || '',
            Estado: 'Programada',
            Agendado_Por: (obtenerSesion() && obtenerSesion().nombre) || '',
            Servicios: JSON.stringify(srvLocal),
            Total_Precio: totalLocal
          });
        }
        aplicarFiltrosCitas();
      } else {
        mostrarToast(respuesta.mensaje, 'error');
      }
    };

    if (id) {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .actualizarCita(tokenSesion(), id, datos);
    } else {
      google.script.run.withSuccessHandler(manejador)
        .withFailureHandler(function(err) { manejador({ exito: false, mensaje: err.message }); })
        .agendarCita(tokenSesion(), datos);
    }
  }

  // Refleja la edición de una cita en la caché local sin recargar del servidor.
  function actualizarCitaLocal(id, datos) {
    (Estado.citas || []).forEach(function(c) {
      if (String(c.ID_Cita) === String(id)) {
        c.ID_Cliente = datos.idCliente || '';
        c.Titulo = datos.titulo || '';
        c.Fecha = String(datos.fecha || '');
        c.Hora = String(datos.hora || '');
        c.Duracion_Mins = parseInt(datos.duracionMins, 10) || 60;
        c.Descripcion = datos.descripcion || '';
        var srvLocal = (datos.servicios || []).map(function(s) {
          var def = (Estado.servicios || []).filter(function(x) {
            return String(x.ID_Servicio) === String(s.id);
          })[0];
          var precio = def ? (parseFloat(def.Precio) || 0) : 0;
          var cant = s.cantidad || 1;
          return {
            id: s.id, nombre: def ? def.Nombre : 'Servicio',
            precio: precio, cantidad: cant, subtotal: precio * cant,
            duracionMins: def ? def.Duracion_Mins : 0
          };
        });
        c.Servicios = JSON.stringify(srvLocal);
        c.Total_Precio = srvLocal.reduce(function(a, s) { return a + (s.subtotal || 0); }, 0);
      }
    });
  }

  function editarCita(id) {
    var c = (window._citasActuales || []).filter(function(x) { return String(x.ID_Cita) === String(id); })[0];
    if (!c) return;
    document.getElementById('citaId').value = c.ID_Cita;
    document.getElementById('cita_cliente').value = c.ID_Cliente || '';
    document.getElementById('cita_titulo').value = c.Titulo || '';
    document.getElementById('cita_fecha').value = fechaLegible(c.Fecha);
    document.getElementById('cita_hora').value = horaLegible(c.Hora);
    document.getElementById('cita_duracion').value = c.Duracion_Mins || 60;
    document.getElementById('cita_descripcion').value = c.Descripcion || '';
    marcarServiciosCita(c.Servicios);
    document.getElementById('tituloFormCita').textContent = 'Editar ' + minuscInicial(etCita());
    document.getElementById('btnGuardarCita').textContent = 'Actualizar cita';
    document.getElementById('btnCancelarCita').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicionCita() {
    var form = document.getElementById('formCita');
    if (form) form.reset();
    var idField = document.getElementById('citaId');
    if (idField) idField.value = '';
    var dur = document.getElementById('cita_duracion');
    if (dur) dur.value = Estado.config.duracionCitaPredeterminada || 60;
    var contSer = document.getElementById('cita_servicios');
    if (contSer) {
      var chs = contSer.querySelectorAll('.serv-cita');
      for (var k = 0; k < chs.length; k++) {
        chs[k].checked = false;
        var ci = chs[k].parentNode.parentNode.querySelector('.serv-cant-cita');
        if (ci) ci.value = '1';
      }
    }
    calcularDuracionCita();
    // Al volver a agendar nuevo, colapsar la lista de servicios.

    var btn = document.getElementById('btnGuardarCita');
    if (btn) btn.textContent = 'Agendar cita';
    var btnCancelar = document.getElementById('btnCancelarCita');
    if (btnCancelar) btnCancelar.style.display = 'none';
  }

  function cargarActividad(forzar, callback) {
    var tbody = document.getElementById('tablaActividad');
    if (!tbody) { if (typeof callback === 'function') callback(); return; }
    tbody.innerHTML = '<tr><td colspan="6" class="cargando">Cargando…</td></tr>';

    var filtros = {
      usuario: (document.getElementById('filtro_usuario_monitor') || {}).value || '',
      modulo: (document.getElementById('filtro_modulo_monitor') || {}).value || '',
      desde: (document.getElementById('filtro_desde_monitor') || {}).value || '',
      hasta: (document.getElementById('filtro_hasta_monitor') || {}).value || ''
    };

    google.script.run
      .withSuccessHandler(function(resp) {
        if (sesionInvalida(resp)) { if (typeof callback === 'function') callback(); return; }
        if (!resp || !resp.exito) {
          tbody.innerHTML = '<tr><td colspan="6" class="vacio">' +
            esc(resp && resp.mensaje ? resp.mensaje : 'No se pudo cargar la actividad.') + '</td></tr>';
          if (typeof callback === 'function') callback();
          return;
        }
        var act = resp.actividades || [];
        if (act.length === 0) {
          var msg = 'No hay actividad registrada.';
          if (resp.total === 0) {
            msg = 'Aún no hay actividades registradas. El monitor registra las acciones a partir de ahora: ' +
                  'cree o edite un cliente, agende o cambie una cita, registre un usuario, etc., y aparecerán aquí.';
          }
          tbody.innerHTML = '<tr><td colspan="6" class="vacio">' + esc(msg) + '</td></tr>';
          if (typeof callback === 'function') callback();
          return;
        }
        function celda(v) { return v ? esc(String(v)) : '<span class="vacio-accion">&mdash;</span>'; }
        tbody.innerHTML = act.map(function(a) {
          return '<tr>' +
            '<td>' + celda(a.Fecha) + '</td>' +
            '<td>' + celda(a.Usuario) +
              (a.Email && a.Email !== a.Usuario ? '<br><small>' + esc(a.Email) + '</small>' : '') + '</td>' +
            '<td>' + celda(a.Rol) + '</td>' +
            '<td>' + celda(a.Modulo) + '</td>' +
            '<td>' + celda(a.Accion) + '</td>' +
            '<td>' + celda(a.Detalle) + '</td>' +
            '</tr>';
        }).join('');
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="6" class="vacio">Error al cargar la actividad.</td></tr>';
        mostrarToast(err.message, 'error');
        if (typeof callback === 'function') callback();
      })
      .obtenerActividad(tokenSesion(), filtros);
  }

  function cargarHistorial(idCliente, forzar, callback) {
    var tbody = document.getElementById('tablaHistorial');
    if (forzar) delete Estado.cacheHistorial[idCliente];
    if (Object.prototype.hasOwnProperty.call(Estado.cacheHistorial, idCliente)) {
      dibujarHistorial(tbody, Estado.cacheHistorial[idCliente]);
      if (typeof callback === 'function') callback();
      return;
    }
    tbody.innerHTML = '<tr><td colspan="9" class="cargando">Cargando…</td></tr>';
    var continuar = function() {
      google.script.run
        .withSuccessHandler(function(registros) {
          if (sesionInvalida(registros)) { if (typeof callback === 'function') callback(); return; }
          Estado.cacheHistorial[idCliente] = registros || [];
          mostrarHistorialFiltrado(tbody, registros || []);
          if (typeof callback === 'function') callback();
        })
        .withFailureHandler(function(err) {
          tbody.innerHTML = '<tr><td colspan="9" class="vacio">Error al cargar historial.</td></tr>';
          mostrarToast(err.message, 'error');
          if (typeof callback === 'function') callback();
        })
        .obtenerHistorial(tokenSesion(), idCliente);
    };
    if (Estado.citasCargados) continuar();
    else cargarCitas(true, continuar);
  }

  function _datosFilaHistorial_(r, mapa) {
    var cita = (r.ID_Cita && mapa) ? mapa[String(r.ID_Cita)] : null;
    var cliente = nombreCliente(r.ID_Cliente);
    var por = (cita && cita.Agendado_Por) ? String(cita.Agendado_Por) : '';
    var fecha = fechaDMY(r.Fecha);
    var descripcion = r.Descripcion || '';
    var servicios = [];
    if (cita && cita.Servicios) {
      try {
        var lista = JSON.parse(String(cita.Servicios || '[]'));
        if (lista && lista.length) {
          servicios = lista.map(function(it) {
            return (it.cantidad || 1) + ' × ' + (it.nombre || 'Servicio');
          });
        }
      } catch (eServ) {}
    }
    var total = (cita && cita.Total_Precio) ? formatoMoneda(cita.Total_Precio) : '';
    var dur = (cita && cita.Duracion_Mins != null && cita.Duracion_Mins !== '') ? (cita.Duracion_Mins + ' min') : '';
    var resultado = r.Resultado || '';
    return {
      cliente: cliente, por: por, fecha: fecha, descripcion: descripcion,
      servicios: servicios, total: total, dur: dur, resultado: resultado
    };
  }

  function _mapaCitas_() {
    var mapa = {};
    (Estado.citas || []).forEach(function(c) { if (c.ID_Cita) mapa[String(c.ID_Cita)] = c; });
    return mapa;
  }

  function dibujarHistorial(tbody, registros) {
    var esAdmin = esAdminSesion();
    if (!registros || registros.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + (esAdmin ? 9 : 8) + '" class="vacio">No hay historial registrado.</td></tr>';
      return;
    }
    var mapa = _mapaCitas_();
    registros.sort(function(a, b) { return String(b.Fecha).localeCompare(String(a.Fecha)); });
    tbody.innerHTML = registros.map(function(r) {
      var d = _datosFilaHistorial_(r, mapa);
      function celda(v) { return v ? esc(v) : '<span class="vacio-accion">&mdash;</span>'; }
      var serviciosHtml = d.servicios.length
        ? d.servicios.map(function(s) { return esc(s); }).join('<br>')
        : '<span class="vacio-accion">&mdash;</span>';
      var accionesHtml = esAdmin
        ? '<button class="btn btn-peligro btn-pequeno" title="Eliminar registro" onclick="confirmarEliminarRegistroHistorial(\'' + esc(r.ID_Registro) + '\')">✕</button>'
        : '';
      return '<tr>' +
        '<td>' + celda(d.cliente) + '</td>' +
        '<td>' + celda(d.por) + '</td>' +
        '<td>' + celda(d.fecha) + '</td>' +
        '<td class="col-wrap">' + celda(d.descripcion) + '</td>' +
        '<td>' + serviciosHtml + '</td>' +
        '<td>' + celda(d.total) + '</td>' +
        '<td>' + celda(d.dur) + '</td>' +
        '<td>' + celda(d.resultado) + '</td>' +
        (esAdmin ? '<td class="acciones-fila">' + accionesHtml + '</td>' : '') +
      '</tr>';
    }).join('');
  }

  function confirmarEliminarRegistroHistorial(id) {
    if (!confirm('¿Está seguro de eliminar este registro del historial? Esta acción no se puede deshacer.')) return;
    mostrarCargaZona('tablaHistorial', 'Eliminando registro…');
    google.script.run
      .withSuccessHandler(function(respuesta) {
        ocultarCargaZona('tablaHistorial');
        if (sesionInvalida(respuesta)) return;
        if (respuesta.exito) {
          mostrarToast(respuesta.mensaje, 'exito');
          Object.keys(Estado.cacheHistorial).forEach(function(clave) {
            Estado.cacheHistorial[clave] = (Estado.cacheHistorial[clave] || []).filter(function(r) {
              return String(r.ID_Registro) !== String(id);
            });
          });
          refrescarVistaHistorial();
        } else {
          mostrarToast(respuesta.mensaje, 'error');
        }
      })
      .withFailureHandler(function(err) { ocultarCargaZona('tablaHistorial'); mostrarToast('Error: ' + err.message, 'error'); })
      .eliminarRegistroHistorial(tokenSesion(), id);
  }

  function filtrarHistorial(registros) {
    var desde = (document.getElementById('hist_fecha_desde').value || '').trim();
    var hasta = (document.getElementById('hist_fecha_hasta').value || '').trim();
    var rp = (document.getElementById('hist_realizada_por').value || '').trim().toLowerCase();
    if (!registros) return [];
    if (!desde && !hasta && !rp) return registros;
    var mapa = _mapaCitas_();
    return registros.filter(function(r) {
      var f = String(r.Fecha || '').slice(0, 10);
      if (desde && f < desde) return false;
      if (hasta && f > hasta) return false;
      if (rp) {
        var cita = r.ID_Cita ? mapa[String(r.ID_Cita)] : null;
        var por = (cita && cita.Agendado_Por) ? String(cita.Agendado_Por).toLowerCase() : '';
        if (por.indexOf(rp) === -1) return false;
      }
      return true;
    });
  }

  function mostrarHistorialFiltrado(tbody, registros) {
    dibujarHistorial(tbody, filtrarHistorial(registros));
  }

  function refrescarVistaHistorial() {
    var id = document.getElementById('sel_cliente_historial').value || '';
    var tbody = document.getElementById('tablaHistorial');
    if (Object.prototype.hasOwnProperty.call(Estado.cacheHistorial, id)) {
      mostrarHistorialFiltrado(tbody, Estado.cacheHistorial[id]);
    } else {
      cargarHistorial(id);
    }
  }

  function _encabezadosHistorial_() {
    return ['Cliente', 'Realizada por', 'Fecha', 'Descripción', 'Servicios', 'Total', 'Duración', 'Resultado'];
  }

  function _filaPlana_(r, mapa) {
    var d = _datosFilaHistorial_(r, mapa || _mapaCitas_());
    return [d.cliente, d.por, d.fecha, d.descripcion, d.servicios.join(' / '), d.total, d.dur, d.resultado];
  }

  function _celdaCSV_(v) {
    v = (v == null) ? '' : String(v);
    if (/[",\r\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function _descargarBlob_(blob, nombre) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
  }

  function cerrarMenuExportar() {
    var m = document.getElementById('menuExportar');
    var b = document.getElementById('btnExportar');
    if (m) m.style.display = 'none';
    if (b) b.setAttribute('aria-expanded', 'false');
  }

  function _describirAlcanceExportar_() {
    var idCliente = (document.getElementById('sel_cliente_historial') || {}).value || '';
    var partes = [];
    partes.push(idCliente ? ('historial de «' + (nombreCliente(idCliente) || 'cliente seleccionado') + '»') : 'todo el historial');
    var desde = (document.getElementById('hist_fecha_desde').value || '').trim();
    var hasta = (document.getElementById('hist_fecha_hasta').value || '').trim();
    if (desde || hasta) {
      partes.push('desde ' + (desde || '…') + ' hasta ' + (hasta || '…'));
    }
    var rp = (document.getElementById('hist_realizada_por').value || '').trim();
    if (rp) partes.push('realizada por: ' + rp);
    return partes.join(' · ');
  }

  function _slugNombreCliente_(idCliente) {
    var n = (nombreCliente(idCliente) || 'cliente').toLowerCase();
    n = n.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return n || 'cliente';
  }

  function _nombreArchivoExportar_(ext) {
    var idCliente = (document.getElementById('sel_cliente_historial') || {}).value || '';
    var sufijo = idCliente ? ('cliente_' + _slugNombreCliente_(idCliente)) : 'todos';
    return 'historial_' + sufijo + '.' + ext;
  }

  function actualizarEtiquetaAlcanceExportar() {
    var el = document.getElementById('etiquetaAlcanceExportar');
    if (el) el.textContent = 'Se exportará: ' + _describirAlcanceExportar_();
  }

  // Prepara la exportación: confirma el alcance, obtiene el historial filtrado
  // por el cliente seleccionado y aplica los filtros de fecha/realizada-por.
  // Al tener los datos listos invoca alListo(filas, restaurar).
  function _prepararExportar_(boton, alListo) {
    var texto = boton ? boton.textContent : '';
    if (boton) { boton.disabled = true; boton.textContent = 'Exportando…'; }
    var restaurar = function() {
      if (boton) { boton.disabled = false; boton.textContent = texto; }
      ocultarCargaZona('tablaHistorial');
    };
    var alcance = _describirAlcanceExportar_();
    if (!window.confirm('Se exportará: ' + alcance + '.\n¿Desea continuar?')) {
      restaurar();
      return;
    }
    mostrarCargaZona('tablaHistorial', 'Generando archivo…');
    var idCliente = (document.getElementById('sel_cliente_historial') || {}).value || '';
    google.script.run
      .withSuccessHandler(function(registros) {
        if (sesionInvalida(registros)) { restaurar(); return; }
        var mapa = _mapaCitas_();
        var filas = filtrarHistorial(registros || []).map(function(r) { return _filaPlana_(r, mapa); });
        if (!filas.length) { restaurar(); mostrarToast('No hay historial para exportar.', 'info'); return; }
        alListo(filas, restaurar);
      })
      .withFailureHandler(function(err) {
        restaurar();
        mostrarToast('No se pudo exportar: ' + err.message, 'error');
      })
      .obtenerHistorial(tokenSesion(), idCliente);
  }

  function exportarExcel() {
    cerrarMenuExportar();
    var boton = document.getElementById('btnExportarExcel');
    _prepararExportar_(boton, function(filas, restaurar) {
      google.script.run
        .withSuccessHandler(function(res) {
          restaurar();
          if (sesionInvalida(res)) return;
          if (!res || !res.exito) { mostrarToast((res && res.mensaje) || 'No se pudo exportar el Excel.', 'error'); return; }
          try {
            var bin = atob(res.base64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            _descargarBlob_(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), _nombreArchivoExportar_('xlsx'));
          } catch (e) {
            mostrarToast('Error al generar el Excel: ' + e.message, 'error');
          }
        })
        .withFailureHandler(function(err) { restaurar(); mostrarToast('No se pudo exportar: ' + err.message, 'error'); })
        .generarExcelHistorial(tokenSesion(), _encabezadosHistorial_(), filas);
    });
  }

  function exportarPDF() {
    cerrarMenuExportar();
    var boton = document.getElementById('btnExportarPDF');
    _prepararExportar_(boton, function(filas, restaurar) {
      google.script.run
        .withSuccessHandler(function(res) {
          restaurar();
          if (sesionInvalida(res)) return;
          if (!res || !res.exito) { mostrarToast((res && res.mensaje) || 'No se pudo exportar el PDF.', 'error'); return; }
          try {
            var bin = atob(res.base64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            _descargarBlob_(new Blob([bytes], { type: 'application/pdf' }), _nombreArchivoExportar_('pdf'));
          } catch (e) {
            mostrarToast('Error al generar el PDF: ' + e.message, 'error');
          }
        })
        .withFailureHandler(function(err) { restaurar(); mostrarToast('No se pudo exportar: ' + err.message, 'error'); })
        .generarPDFHistorial(tokenSesion(), _encabezadosHistorial_(), filas);
    });
  }

    document.getElementById('btnCancelarModalLogo').addEventListener('click', cerrarModalLogo);

    var btnImportarServicios = document.getElementById('btnImportarServicios');
    var archivoServicios = document.getElementById('cfg_servicios_archivo');
    if (btnImportarServicios && archivoServicios) {
      btnImportarServicios.addEventListener('click', function() { archivoServicios.click(); });
      archivoServicios.addEventListener('change', importarServiciosDesdeArchivo);

  // Lee un .txt con servicios preestablecidos (formato: Nombre|Precio|Duración|Descripción,
  // una línea por servicio; líneas vacías o que empiecen con # se ignoran) y los crea en
  // el catálogo. Quedan editables como cualquier otro servicio desde la pestaña Servicios.
  function importarServiciosDesdeArchivo() {
    var input = document.getElementById('cfg_servicios_archivo');
    var archivo = input.files[0];
    if (!archivo) return;
    var btn = document.getElementById('btnImportarServicios');
    var lector = new FileReader();
    lector.onload = function() {
      var lineas = String(lector.result || '').split(/\r?\n/);
      var servicios = [];
      lineas.forEach(function(linea) {
        linea = linea.trim();
        if (!linea || linea.charAt(0) === '#') return;
        var partes = linea.split('|').map(function(p) { return p.trim(); });
        if (!partes[0]) return;
        servicios.push({
          nombre: partes[0],
          precio: partes[1] || '0',
          duracionMins: parsearDuracion(partes[2] || '60'),
          descripcion: partes[3] || ''
        });
      });
      input.value = '';
      if (servicios.length === 0) {
        mostrarToast('El archivo no tiene servicios válidos. Use el formato: Nombre|Precio|Duración|Descripción', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Importando…';
      google.script.run
        .withSuccessHandler(function(respuesta) {
          btn.disabled = false;
          btn.textContent = 'Cargar servicios desde archivo (.txt)';
          if (sesionInvalida(respuesta)) return;
          if (respuesta.exito) {
            mostrarToast(respuesta.mensaje, 'exito');
            cargarServicios(true);
          } else {
            mostrarToast(respuesta.mensaje, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Cargar servicios desde archivo (.txt)';
          mostrarToast('Error: ' + err.message, 'error');
        })
        .importarServiciosDesdeTexto(tokenSesion(), servicios);
    };
    lector.onerror = function() { mostrarToast('No se pudo leer el archivo.', 'error'); };
    lector.readAsText(archivo);
  }
